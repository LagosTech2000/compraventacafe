          csv:
            one: "1 tabla en CSV, que se abre en Excel."
            other: "%{count} tablas en CSV, una por archivo, que se abren en Excel."
          readme: "qué contiene y cómo restaurarlo."
          secrets: "Llega como un archivo .zip con una carpeta adentro. Los CSV no llevan contraseñas cifradas ni sesiones; el .dump sí trae todo, porque sirve para restaurar el sistema: guárdalo en un lugar seguro."
        server:
          title: "En este servidor"
          database: "Base de datos"
          pg_dump: "pg_dump"
          missing: "No está instalado"
          ok: "El respaldo incluirá base.dump"
          old: "pg_dump %{pg_dump} es más viejo que la base de datos (PostgreSQL %{server}): el respaldo traerá solo los CSV."
          none: "Este servidor no tiene pg_dump: el respaldo traerá solo los CSV."
      readme:
        dump_included: "base.dump: la base de datos completa (formato personalizado de pg_dump)."
        no_pg_dump: "base.dump no viene: el servidor no tiene pg_dump."
        old_pg_dump: "base.dump no viene: pg_dump %{pg_dump} es más viejo que la base de datos (PostgreSQL %{server})."
        dump_failed: "base.dump no viene: pg_dump falló (%{error})."
        body: |
          Respaldo de datos de %{business}
          Generado el %{at}

          Contenido
          - %{dump}
          - csv/: %{tables} tablas, una por archivo, con los nombres de columna de la base de datos.
            Se abren en Excel. No llevan contraseñas cifradas ni sesiones de inicio.
          - LEEME.txt: este archivo.

          Restaurar la base de datos (base.dump)
            createdb nombre_de_la_base
            pg_restore --no-owner --no-acl --dbname=nombre_de_la_base base.dump
          pg_restore debe ser de la misma versión de PostgreSQL o más nueva.

          Guarde este respaldo en un lugar seguro: base.dump contiene todos los datos del sistema.
