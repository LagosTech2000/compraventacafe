  # Guías de ayuda del botón "?" (HelpGuide). Una por pantalla en "screens"
  # (ruta del controlador + acción; "form" sirve para crear y editar) y una
  # por proceso en "processes". Solo describen lo que el sistema ya hace.
  help_guides:
    ui:
      label: "Guía de ayuda"
      open: "Ayuda: %{title}"
      eyebrow: "Guía de ayuda"
      steps: "Paso a paso"
      tips: "Ten en cuenta"
      close: "Cerrar la guía"
      how_it_works: "¿Cómo funciona?"
    general:
      title: "Cómo usar el sistema"
      summary: "El sistema está dividido en módulos. Solo ves los módulos y botones para los que tienes permiso."
      steps:
        - "Entra a un módulo desde el Inicio o desde el menú de arriba (en el celular, el botón «Menú»)."
        - "En las listas, usa «Filtros» para buscar y «Detalle» para abrir un registro en una ventana."
        - "Los botones «Nuevo…» y «Editar» abren un formulario; al guardar, la lista se actualiza sola."
        - "Toca el botón «?» en cualquier pantalla para ver cómo se usa."
      tips:
        - "Si no ves un módulo o un botón, pídele a un administrador que te dé el permiso."
        - "Si aparece un error con un código de referencia, pásale ese código a un administrador."
    processes:
      purchase_lifecycle:
        title: "Etapas de una compra"
        summary: "Cada compra pasa por tres etapas, en este orden. La barra de etapas muestra en cuál está y el botón del siguiente paso."
        steps:
          - "Compra registrada: se pesa el café y se registra la compra (Nueva compra). El sistema calcula sacos, tara, peso neto y total."
          - "Facturada: se agrupan en una factura las compras sin facturar de un mismo productor (Facturar compras) y se le entrega el recibo."
          - "Cancelada (pagada): cuando se le paga al productor, se abre la factura y se marca como cancelada con la forma y la fecha de pago."
        tips:
          - "Una compra facturada ya no se puede editar ni borrar."
          - "Una factura no se borra: solo pasa de pendiente de pago a cancelada."
          - "La factura también se puede crear ya cancelada, si el pago se hace en el momento."
    screens:
      sessions:
        form:
          title: "Iniciar sesión"
          summary: "Entra con el correo y la contraseña que te dio un administrador."
          steps:
            - "Escribe tu correo electrónico."
            - "Escribe tu contraseña."
            - "Toca «Entrar»."
          tips:
            - "No hay registro público: solo un administrador crea usuarios."
            - "Si olvidaste la contraseña, pídele a un administrador que la restablezca."
            - "Después de varios intentos fallidos hay que esperar unos minutos."
      dashboard:
        show:
          title: "Inicio"
          summary: "Muestra los módulos a los que tienes acceso."
          steps:
            - "Toca la tarjeta de un módulo para entrar."
            - "Para volver aquí, toca el logo de arriba a la izquierda."
            - "Para salir, usa «Cerrar sesión» (en el celular, dentro de «Menú»)."
          tips:
            - "Si no ves ningún módulo, pídele a un administrador que te asigne permisos."
      administration:
        home:
          index:
            title: "Administración"
            summary: "Desde aquí se manejan las personas del negocio y, si eres administrador, los usuarios y la auditoría."
            steps:
              - "Personas: clientes y colaboradores del negocio."
              - "Usuarios: quién entra al sistema y qué puede hacer en cada módulo."
              - "Auditoría: el registro de todo lo que se ha creado, modificado o borrado."
        people:
          index:
            title: "Personas"
            summary: "Lista de las personas del negocio. Una misma persona puede ser cliente, colaborador y productor a la vez."
            steps:
              - "Busca por nombre, apellido, DNI o RTN en «Filtros»; también puedes filtrar por rol y departamento."
              - "Toca «Detalle» para ver los datos de una persona."
              - "Toca «Nueva persona» para registrar a alguien."
          show:
            title: "Detalle de la persona"
            summary: "Datos de identidad, contacto, dirección y roles de la persona."
            steps:
              - "Toca «Editar» para cambiar sus datos o sus roles."
              - "Toca «Borrar» para eliminarla; el sistema pide confirmación."
            tips:
              - "Una persona que es productor no se puede borrar."
          form:
            title: "Registrar o editar una persona"
            summary: "Solo los nombres y los apellidos son obligatorios."
            steps:
              - "Escribe nombres y apellidos."
              - "Si los tienes, agrega DNI, RTN, teléfono y correo."
              - "Para la dirección, elige primero el departamento; después se habilita el municipio."
              - "Marca los roles: cliente, colaborador o ambos."
              - "Toca el botón de guardar."
            tips:
              - "DNI: 13 dígitos. RTN: 14 dígitos. Se pueden escribir con guiones o espacios."
              - "El DNI y el RTN no se pueden repetir entre personas."
              - "Teléfono: 8 dígitos, con o sin +504."
        users:
          index:
            title: "Usuarios"
            summary: "Las personas que pueden entrar al sistema. Solo los administradores ven esta pantalla."
            steps:
              - "Busca por nombre o correo, o filtra por tipo y estado, en «Filtros»."
              - "Toca «Detalle» para ver los permisos de un usuario."
              - "Toca «Nuevo usuario» para darle acceso a alguien."
            tips:
              - "Los usuarios no se borran: se desactivan para conservar el registro de lo que hicieron."
          show:
            title: "Detalle del usuario"
            summary: "Muestra el tipo, el estado y los permisos por módulo del usuario."
            steps:
              - "Toca «Editar» para cambiar sus datos, permisos o estado."
              - "Toca «Restablecer contraseña» si la olvidó."
          form:
            title: "Crear o editar un usuario"
            summary: "Cada usuario tiene permisos separados de ver, crear, editar y borrar en cada módulo."
            steps:
              - "Escribe el nombre completo y el correo electrónico."
              - "Al crearlo, define una contraseña de al menos 8 caracteres y confírmala."
              - "Marca «Administrador» solo si debe tener acceso completo y manejar usuarios."
              - "En la tabla de permisos, marca qué puede hacer en cada módulo."
              - "Para quitarle el acceso, edítalo y desmarca «Activo»."
            tips:
              - "Un usuario inactivo no puede entrar, y si tenía una sesión abierta, se cierra."
              - "No se puede desactivar ni quitar el rol de administrador al último administrador activo."
          edit_password:
            title: "Restablecer contraseña"
            summary: "Define una contraseña nueva para el usuario cuando la olvidó."
            steps:
              - "Escribe la contraseña nueva (al menos 8 caracteres)."
              - "Escríbela otra vez para confirmarla."
              - "Guarda y díctale la contraseña al usuario."
            tips:
              - "Se cierran todas las sesiones abiertas del usuario: debe entrar de nuevo."
        audit_events:
          index:
            title: "Auditoría"
            summary: "Registro de todo lo que se crea, modifica o borra, y de cada inicio y cierre de sesión. No se puede modificar ni borrar."
            steps:
              - "Usa «Filtros» para buscar por fechas, usuario, acción, entidad o texto."
              - "Toca «Detalle» para ver qué campos cambiaron, con su valor antes y después."
            tips:
              - "Las contraseñas nunca se muestran: aparecen como «(oculto)»."
          show:
            title: "Detalle de la acción"
            summary: "Quién hizo el cambio, cuándo, desde qué dirección IP y qué campos cambiaron."
            steps:
              - "Revisa la tabla de cambios: cada campo con su valor antes y después."
              - "La referencia de la solicitud es el mismo código que aparece en los mensajes de error."
      trading:
        home:
          index:
            title: "Resumen de compra y venta"
            summary: "El trabajo del día en cuatro pasos. Lo resaltado tiene trabajo pendiente."
            steps:
              - "Pesar y registrar compras: cada pesada es una compra."
              - "Facturar: agrupa las compras sin facturar de un productor en una factura."
              - "Registrar pagos: marca como canceladas las facturas que ya se pagaron."
              - "Cerrar el día: revisa e imprime el cierre diario."
            tips:
              - "Usa las pestañas de arriba para ir a compras, facturas, productores, zonas o el cierre diario."
        purchases:
          index:
            title: "Compras"
            summary: "Lista de compras. Al entrar muestra solo las de hoy."
            steps:
              - "Cambia las fechas en «Filtros» para ver otros días; también puedes filtrar por productor, zona, estado del café y facturación."
              - "Toca «Detalle» para ver el cálculo de una compra."
              - "Toca «Editar» para corregir una compra que todavía no está facturada."
          show:
            title: "Detalle de la compra"
            summary: "Muestra el cálculo completo de la compra y en qué etapa está."
            steps:
              - "Revisa la barra de etapas: registrada, facturada o cancelada."
              - "Usa el botón del siguiente paso: facturar ahora o registrar el pago de su factura."
              - "Si todavía no está facturada, puedes editarla o borrarla."
            tips:
              - "Una compra facturada ya no se puede editar ni borrar."
          form:
            title: "Registrar o editar una compra"
            summary: "Registra una pesada. El sistema calcula sacos, tara, peso neto y total mientras escribes."
            steps:
              - "Escribe el nombre del productor y elígelo de la lista. Si no existe, toca «¿No está? Registrar productor»."
              - "Revisa la fecha y la zona (se llena con la zona del productor) y elige el estado del café."
              - "Escribe el peso bruto, la humedad y el precio por libra."
              - "Revisa el cálculo y toca el botón de guardar."
            tips:
              - "Tara: 1 libra por cada saco de 165 libras, redondeado hacia arriba."
              - "Peso neto = (peso bruto − tara) menos el porcentaje de humedad."
              - "El cálculo que se guarda es el del sistema; el de la pantalla es una vista previa."
        invoices:
          index:
            title: "Facturas"
            summary: "Lista de facturas, las más recientes primero."
            steps:
              - "Filtra por fechas, productor o número, zona, estado de pago y forma de pago."
              - "Toca «Detalle» para ver una factura, imprimirla o registrar su pago."
              - "Toca «Facturar compras» para crear una factura nueva."
          form:
            title: "Facturar compras"
            summary: "Una factura agrupa compras sin facturar de un mismo productor."
            steps:
              - "Elige el productor de la lista de productores con compras sin facturar."
              - "Deja marcadas las compras que van en la factura."
              - "En «Pago», elige si queda pendiente de pago o ya cancelada."
              - "Si ya está cancelada, elige la forma y la fecha de pago."
              - "Toca «Crear factura»."
            tips:
              - "Las compras facturadas ya no se pueden editar ni borrar."
          show:
            title: "Factura"
            summary: "El recibo para el productor, con original y copia."
            steps:
              - "Toca «Imprimir»: el original y la copia salen en hojas separadas."
              - "Cuando se le pague al productor, elige la forma de pago y la fecha, y toca «Marcar como cancelada»."
            tips:
              - "Desde la ventana de detalle, «Imprimir» abre la factura en página completa."
              - "Una factura no se borra; una vez cancelada, ya no cambia."
        producers:
          index:
            title: "Productores"
            summary: "Productores, carreros (intermediarios) y fincas propias a quienes se les compra café."
            steps:
              - "Busca por nombre, apellido, DNI o RTN; también puedes filtrar por tipo y zona."
              - "Toca «Detalle» para ver sus compras sin facturar y sus últimas facturas."
              - "Toca «Nuevo productor» para registrar uno."
          show:
            title: "Detalle del productor"
            summary: "Sus datos, las compras que tiene sin facturar y sus últimas facturas."
            steps:
              - "Toca «Nueva compra» para registrarle una compra."
              - "Toca «Facturar compras» para facturar lo que tiene pendiente."
              - "Toca «Editar» para cambiar sus datos."
          form:
            title: "Registrar o editar un productor"
            summary: "Datos de compra del productor y sus datos personales."
            steps:
              - "Elige el tipo: productor, carrero (intermediario) o finca propia."
              - "Elige su zona y, si aplica, el nombre de la finca."
              - "Escribe nombres y apellidos; el resto de datos es opcional."
              - "Toca el botón de guardar."
            tips:
              - "Si lo registras desde una compra, al guardar queda elegido en esa compra sin perder lo que ya escribiste."
              - "Cada productor también aparece en Administración → Personas."
        zones:
          index:
            title: "Zonas"
            summary: "Los lugares de donde vienen los productores."
            steps:
              - "Busca una zona por nombre en «Filtros»."
              - "Toca «Nueva zona» para agregar una, o «Editar» para cambiarle el nombre."
          form:
            title: "Crear o editar una zona"
            summary: "Una zona solo tiene nombre."
            steps:
              - "Escribe el nombre de la zona."
              - "Toca el botón de guardar."
            tips:
              - "Si la creas desde una compra, al guardar queda elegida en esa compra."
        daily_closes:
          show:
            title: "Cierre diario"
            summary: "Resumen y detalle de las compras de un día."
            steps:
              - "Elige la fecha: el cierre se actualiza solo."
              - "Revisa los totales: comprado, pagado, pendiente de pago y sin facturar."
              - "Toca «Imprimir» para sacar el reporte."
            tips:
              - "El reporte agrupa las compras en canceladas, pendientes de pago y sin facturar."
      farms:
        home:
          index:
            title: "Fincas"
            summary: "Este módulo todavía no tiene funciones."
            steps:
              - "Cuando esté listo, aquí se van a manejar las fincas propias."
      loans:
        home:
