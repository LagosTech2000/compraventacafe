          - %{dump}
          - csv/: %{tables} tablas, una por archivo, con los nombres de columna de la base de datos.
            Se abren en Excel. No llevan contraseñas cifradas ni sesiones de inicio.
          - LEEME.txt: este archivo.

          Restaurar la base de datos (base.dump)
            createdb nombre_de_la_base
            pg_restore --no-owner --no-acl --dbname=nombre_de_la_base base.dump
          pg_restore debe ser de la misma versión de PostgreSQL o más nueva.

          Guarde este respaldo en un lugar seguro: base.dump contiene todos los datos del sistema.
