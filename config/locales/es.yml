          net: "Neto"
          count: "Movimientos"
        charts:
          flow:
            title: "Entradas y salidas en el tiempo"
            help: "Barras: lo que entró y lo que salió. Línea: el saldo que se va acumulando en el período."
          out_sources:
            title: "En qué salió el dinero"
            help: "Salidas por origen."
          in_methods:
            title: "Cómo entró el dinero"
            help: "Entradas por forma de pago."

  module_home:
    empty: "Este módulo todavía no tiene funciones."

  # Guías de ayuda del botón "?" (HelpGuide). Una por pantalla en "screens"
  # (ruta del controlador + acción; "form" sirve para crear y editar) y una
  # por proceso en "processes". Solo describen lo que el sistema ya hace.
  help_guides:
    ui:
      label: "Guía de ayuda"
      open: "Ayuda: %{title}"
      eyebrow: "Guía de ayuda"
      steps: "Paso a paso"
      tips: "Ten en cuenta"
      close: "Cerrar la guía"
      how_it_works: "¿Cómo funciona?"
    general:
      title: "Cómo usar el sistema"
      summary: "El sistema está dividido en módulos. Solo ves los módulos y botones para los que tienes permiso."
      steps:
        - "Entra a un módulo desde el Inicio o desde el menú de arriba (en el celular, el botón «Menú»)."
        - "En las listas, usa «Filtros» para buscar y toca cualquier parte de una fila (o su botón «Detalle» o «Abrir») para abrir el registro."
        - "Los botones «Nuevo…» y «Editar» abren un formulario; al guardar, la lista se actualiza sola."
        - "Toca el botón «?» en cualquier pantalla para ver cómo se usa."
      tips:
        - "Si no ves un módulo o un botón, pídele a un administrador que te dé el permiso."
        - "Si aparece un error con un código de referencia, pásale ese código a un administrador."
        - "El Inicio y las pantallas de Compra de café y Préstamos se actualizan solas cuando otra persona registra algo: lo nuevo aparece con un brillo y las cifras que cambian dan un pulso. Abajo a la izquierda dice «En vivo». Si tienes una ventana abierta, se actualiza al cerrarla."
    processes:
      finance_money:
        title: "Cuentas, gastos y movimientos"
        summary: "Control financiero junta todo el dinero que entra y sale del negocio, de todos los módulos, y lleva el saldo de cada cuenta."
        steps:
          - "Registra la caja y los bancos en Cuentas, con su saldo inicial, y marca para qué forma de pago se sugiere cada una."
          - "Cada pago o cobro de cualquier módulo (abonos a facturas, carreros, préstamos, planillas, cobros de ventas) pide la cuenta; se sugiere la de la forma de pago."
          - "Los gastos e inversiones del negocio se registran aquí, con su categoría, cuenta y, si quieres, la foto o el PDF del comprobante."
          - "El dinero que entra fuera de los módulos va en «Otro ingreso»; el que pasa de una cuenta a otra, en «Transferir»."
          - "Movimientos muestra todo junto; al elegir una cuenta, el saldo después de cada movimiento."
          - "Consolidación lista lo registrado sin cuenta para asignarle una, de uno en uno o varios a la vez."
        tips:
          - "Nada se registra dos veces: los pagos de los otros módulos se ven aquí, pero se registran donde ocurren."
          - "Lo registrado sin cuenta no cuenta en ningún saldo; aparece aparte en Cuentas."
          - "El presupuesto va por categoría de primer nivel y mes, contra los gastos e inversiones de Control financiero."
      sales_flow:
        title: "Salida, peso en destino, venta y cobro"
        summary: "El café sale del inventario en camiones, se pesa otra vez donde el comprador, se vende con el peso del comprador y se cobra por abonos."
        steps:
          - "Nueva salida: elige el comprador, el estado del café y escribe el peso bruto y los sacos de la báscula local (con la humedad y el daño, o el rendimiento en uva). El inventario baja con su peso neto."
          - "Cuando el camión llega, en la salida toca «Registrar peso en destino» y copia la nota de peso del comprador. El sistema muestra la diferencia entre las dos básculas."
          - "Nueva venta: elige el comprador y marca sus salidas ya pesadas en destino (todas del mismo estado del café). Escribe el precio por quintal (100 lb) o por libra y el número de documento del comprador."
          - "Elige cómo se cobra: de contado (cobrada completa), con un cobro parcial o a crédito."
          - "Después, en la venta, «Registrar cobro» por cada pago del comprador. Cada cobro tiene su recibo, original y copia en hojas separadas."
        tips:
          - "La venta se cobra con el peso del comprador; la diferencia con la báscula local se muestra en la salida, en la venta y en los reportes."
          - "Si la diferencia pasa la tolerancia de Configuración del sitio, sale resaltada. Si es mucha, la venta se puede anular antes de cobrarla: sus salidas quedan libres para otra venta."
          - "Si el café regresa al beneficio, anula la salida (cuando no esté en una venta): vuelve al inventario."
          - "Los cobros van en orden de fecha, no pasan de lo que falta y solo se quita el último."
      private_documents:
        title: "Pagaré y contrato de préstamo"
        summary: "Dos documentos fijos que se imprimen para cada préstamo, llenos con los datos de la persona y del préstamo."
        steps:
          - "Un administrador escribe o pega su texto en Administración → Documentos privados, y pone variables donde va cada dato (nombre, DNI, monto, plazo…)."
          - "En el préstamo (en su detalle o en el estado de cuenta de la persona), toca «Pagaré» o «Contrato»."
          - "Se abre el documento lleno, para revisarlo. Si a la persona le falta un dato (por ejemplo, estado civil), «Completar datos de la persona» abre su ficha encima; al guardar, el documento se vuelve a llenar."
          - "Toca «Imprimir»: se abre la ventana de impresión."
          - "Al lado de cada botón está cuántas veces se ha impreso ese documento para ese préstamo."
        tips:
          - "Un dato que falta sale como línea en blanco, para llenarlo a mano."
          - "Cada impresión queda guardada tal como salió. Los administradores ven, al pasar el puntero sobre el contador, cuándo fueron las últimas y quién las imprimió."
          - "Imprimir pide permiso de crear en Préstamos; completar los datos de la persona, el de editar en Administración."
      invoice_payments:
        title: "Pagar una factura por abonos"
        summary: "Una factura se paga completa o en varios abonos, cada uno con su recibo."
        steps:
          - "Al facturar, elige si queda pendiente de pago, cancelada o con un pago parcial y su monto."
          - "Después, en el detalle de la factura, toca «Registrar abono»: monto, fecha y forma de pago."
          - "Cada abono tiene su recibo imprimible, original y copia en hojas separadas."
          - "Sin abonos la factura está pendiente; con abonos que no cubren el total, en pago parcial; al cubrirlo, cancelada."
        tips:
          - "Un abono no pasa del saldo ni va antes de la fecha de la factura o del último abono."
          - "Solo se quita el último abono."
      hauler_commission:
        title: "Comisión y pagos de un carrero"
        summary: "El carrero trae el café con los carros del negocio y gana una comisión por cada compra que trae."
        steps:
          - "Al registrarlo se anotan su porcentaje y el precio de la lata; se pueden cambiar después y cuentan para las compras nuevas."
          - "En «Nueva compra» elige al carrero: la compra guarda su porcentaje y su precio de la lata de ese día."
          - "Comisión = (libras netas ÷ 16.5) × precio de la lata × porcentaje."
          - "La paga el negocio aparte: no cambia la factura ni lo que se le paga al productor."
          - "En su página está lo que ha ganado, lo pagado y el saldo; «Registrar pago» paga del saldo, con su recibo."
        tips:
          - "Un pago no pasa del saldo ni va antes del último, y solo se quita el último."
          - "Un carrero desactivado no se elige en compras nuevas."
      coffee_payment:
        title: "Pagar préstamos con café"
        summary: "Con el dinero de una compra se abonan o saldan los préstamos de la persona del productor."
        steps:
          - "En el detalle de la compra, toca «Abonar con esta compra»."
          - "Escribe cuánto va a cada préstamo y la fecha del abono (hoy por defecto)."
          - "Cada abono paga primero el interés y luego el capital, y salda el préstamo si cubre todo."
          - "La factura muestra el total de compras, cada abono restado y el total a pagar al productor."
        tips:
          - "La suma de los abonos no pasa del total de la compra."
          - "Una compra con abonos no se edita, anula ni borra: para cambiarla se quita el abono."
      payroll_payment:
        title: "Pagar un período de planilla"
        summary: "Desde su día de pago, cada período se paga con lo que el sistema calcula de lo anotado."
        steps:
          - "Revisa la asistencia, las latas o las tareas del período («Revisar asistencia/latas»)."
          - "En «Pagar período» sale cada empleado con lo que ganó, sus horas y días extra, y sus préstamos."
          - "Si debe, escribe cuánto se le descuenta para abonar a su préstamo (nunca más de lo que gana)."
          - "Elige la fecha y toca «Pagar período»: se guarda lo calculado y se abre la planilla de pago imprimible."
        tips:
          - "Un período pagado queda cerrado: su asistencia, latas y tareas ya no cambian."
          - "Solo se quita el pago del último período, con sus abonos."
      harvest:
        title: "Planilla de corte por lata"
        summary: "Los cortadores ganan por las latas que cortan; los caporales, por día."
        steps:
          - "Agrega a los cortadores sin rol ni salario propio: ganan latas × precio de la lata de la planilla."
          - "Agrega a los caporales con un rol o un salario propio: ganan por día con su asistencia."
          - "En «Latas de hoy» anota las latas de cada cortador, de cuarto en cuarto (0.25, 0.50, 0.75…)."
          - "La asistencia de los caporales se marca igual que en una planilla por día."
        tips:
          - "Un empleado con latas no pasa a ganar por día, ni al revés."
      person_merge:
        title: "Fusionar dos registros de la misma persona"
        summary: "Para una persona registrada dos veces: todo lo de la otra pasa a la que queda."
        steps:
          - "Busca a la otra persona y elige cuál de las dos queda."
          - "Toca «Comparar» y elige, dato por dato, qué valor se conserva."
          - "Revisa lo que se va a mover (compras, facturas, fincas, préstamos, planillas) y confirma."
        tips:
          - "No se puede deshacer y queda en la auditoría."
          - "No se fusionan dos personas de la misma planilla."
      saved_reports:
        title: "Guardar los filtros de un reporte"
        summary: "«Mis filtros» guarda un reporte con sus filtros para volver a él con un clic."
        steps:
          - "Arma el reporte: elige el reporte, el período y los filtros."
          - "Toca «Guardar filtros» y ponle un nombre."
          - "Vuelve a él desde «Mis filtros», arriba del reporte."
        tips:
          - "Se guarda el período, no las fechas: «Este mes» siempre es el mes en curso."
          - "Tus filtros son solo tuyos: nadie más los ve."
      payroll_several_roles:
        title: "Una persona en varios roles"
        summary: "En una planilla por día, la misma persona puede trabajar unos días en un rol y otros días en otro, cada uno con su salario. Ejemplo: chofer 3 días y jornalero 2 días."
        steps:
          - "En «Empleados», agrega a la persona con su primer rol (por ejemplo, Chofer)."
          - "Toca «Otro rol» en su fila (o «Agregar empleado» otra vez) y elige el segundo rol (Jornalero)."
          - "En la asistencia sale en dos filas, con el rol bajo el nombre. Marca los días de chofer en una fila y los de jornalero en la otra."
          - "Al pagar el período sale en una sola tarjeta con lo que ganó en cada rol, y sus préstamos se descuentan una vez del total."
          - "La planilla de pago trae una línea por rol, cada una con su firma."
        tips:
          - "Un mismo día va en un solo rol: no se puede marcar en los dos."
          - "No se repite con el mismo rol. Un salario propio sin rol cuenta como un rol más."
          - "Solo en planillas por día; en corte de café y por obra cada persona va una vez."
          - "Las horas y días extra se anotan en la fila del rol al que corresponden."
      payroll_loans:
        title: "Préstamos de los empleados"
        summary: "Dos formas de abonar a los préstamos de un empleado sin salir de la planilla: descontarlo del salario al pagar el período, o registrar un abono aparte."
        steps:
          - "Abre la planilla y toca la pestaña «Préstamos»: sale cada empleado con lo que debe hoy, sus préstamos por cobrar, los vencidos y su score de pago."
          - "Toca «Estado de cuenta» (o la fila) para ver todos sus préstamos, el historial de préstamos y abonos, y para imprimirlo."
          - "Para descontarlo del salario: en «Períodos de pago» toca «Pagar». Bajo cada empleado que debe, escribe cuánto descontar de cada préstamo o toca «Saldar»."
          - "Para un abono aparte (efectivo, transferencia o cheque): en la pestaña «Préstamos» toca «Abonar» junto al préstamo. Al registrarlo vuelves a la planilla con el recibo abierto para imprimir."
        tips:
          - "El descuento no puede pasar de lo que gana el empleado en el período, y queda en la planilla de pago como «Descuento de planilla»."
          - "Todo abono paga primero el interés acumulado y luego el capital, igual que en el módulo Préstamos."
          - "Un descuento de planilla se quita solo quitando el pago del período."
          - "Ver esta pestaña pide ver Préstamos; descontar o abonar pide crear en Préstamos."
      purchase_lifecycle:
        title: "Etapas de una compra"
        summary: "Cada compra pasa por tres etapas, en este orden. La barra de etapas muestra en cuál está y el botón del siguiente paso."
        steps:
          - "Compra registrada: se pesa el café y se registra la compra (Nueva compra). El sistema calcula sacos, tara, peso neto y total."
          - "Facturada: se agrupan en una factura las compras sin facturar de un mismo productor (Facturar compras) y se le entrega el recibo."
          - "Cancelada (pagada): se le paga al productor con uno o más abonos desde la factura (Registrar abono). Mientras falte saldo, la factura está en «Pago parcial»; al cubrir el total pasa a cancelada."
        tips:
          - "Una compra facturada ya no se puede editar ni borrar."
          - "Una factura no se borra: pasa de pendiente a pago parcial y a cancelada con sus abonos. Solo se puede quitar el último abono."
          - "La factura también se puede crear ya cancelada o con un pago parcial, si se paga en el momento."
      loan_interest:
        title: "Cómo se calcula el interés"
        summary: "Interés simple, con la tasa mensual de cada préstamo, sobre lo que todavía se debe."
        steps:
          - "Cada día corre interés sobre el capital pendiente: capital × tasa mensual × días ÷ 30."
          - "Cuando la persona abona, el abono paga primero el interés acumulado."
          - "Lo que sobra del abono baja el capital, y desde ese día el interés corre sobre el capital nuevo."
          - "Cuando el capital y el interés llegan a cero, el préstamo queda pagado."
        tips:
          - "Ejemplo: L 10,000 al 3 % mensual; a los 30 días abona L 5,000. Van L 300 a interés y L 4,700 a capital; el mes siguiente el interés es sobre L 5,300."
          - "Después de la fecha límite el interés sigue corriendo con la misma tasa; no hay recargo por mora."
          - "Cada abono guarda cuánto fue a interés y a capital."
      payer_score:
        title: "Score de pago"
        summary: "Qué tan buen pagador es la persona: el porcentaje de sus préstamos que pagó completos a tiempo."
        steps:
          - "Cuentan los préstamos ya pagados y los que pasaron su fecha límite sin pagarse."
          - "Un préstamo pagado completo hasta su fecha límite cuenta como pagado a tiempo."
          - "Score = préstamos pagados a tiempo ÷ préstamos que cuentan × 100."
        tips:
          - "85 a 100: Excelente. 70 a 84: Bueno. 50 a 69: Regular. 0 a 49: Riesgo."
          - "Los préstamos que todavía no vencen no cuentan hasta que se paguen o venzan."
          - "Sin préstamos que cuenten, aparece «Sin historial»."
    screens:
      sessions:
        form:
          title: "Iniciar sesión"
          summary: "Entra con el correo y la contraseña que te dio un administrador, o con tu huella."
          steps:
            - "Escribe tu correo electrónico."
            - "Escribe tu contraseña."
            - "Toca «Entrar»."
            - "O toca «Entrar con huella» y pon tu dedo (o desbloquea el dispositivo): no hace falta escribir nada."
          tips:
            - "La huella se registra en Mi configuración (tu nombre, arriba), en cada dispositivo donde la quieras usar."
            - "No hay registro público: solo un administrador crea usuarios."
            - "Si olvidaste la contraseña, pídele a un administrador que la restablezca."
            - "Después de varios intentos fallidos hay que esperar unos minutos."
      profile_photos:
        show:
          title: "Foto de perfil"
          summary: "La foto de una persona o de un usuario, tal como se guardó."
          steps:
            - "Se cambia en el formulario de la persona, del productor o en Mi configuración."
      site_logos:
        show:
          title: "Logo del negocio"
          summary: "La imagen del logo que se configura en Administración → Configuración del sitio."
          steps:
            - "Para cambiarlo, un administrador entra a Administración → Configuración del sitio."
      user_settings:
        form:
          title: "Mi configuración"
          summary: "Tus datos, cómo se ve el sistema para ti, tu contraseña y tu huella. Lo de la pantalla solo cambia la tuya."
          steps:
            - "«Mis datos»: tu foto, tu nombre y tu correo (con el correo inicias sesión)."
            - "«Páginas que se abren encima»: en una ventana al centro, o en un panel que entra desde la derecha. En el panel, lo que abras dentro se muestra en el mismo panel; «Atrás» vuelve a la pantalla anterior. En ventanas, «Atrás» cierra la de arriba."
            - "«Menú principal»: arriba o en una columna a la izquierda (en el celular siempre arriba)."
            - "«Contraseña»: para cambiarla escribe la actual y dos veces la nueva. Déjala en blanco si no la cambias."
            - "Toca «Guardar configuración»."
            - "«Huella digital»: ponle un nombre al dispositivo y toca «Registrar huella de este dispositivo»; el dispositivo te pide el dedo (o su desbloqueo). Desde ahí puedes entrar con «Entrar con huella»."
          tips:
            - "Cambiar el correo también pide tu contraseña actual."
            - "La huella es una forma más de entrar: la contraseña sigue sirviendo. Registra cada celular o computadora donde la quieras usar."
            - "Si pierdes un dispositivo, toca «Quitar» en su huella."
      picker_searches:
        show:
          title: "Buscar al escribir"
          summary: "Los campos para elegir un productor o una persona buscan mientras escribes, en vez de cargar la lista completa."
          steps:
            - "Escribe al menos 3 letras del nombre o números del DNI o del RTN (en productores, también la clave IHCAFE)."
            - "Elige uno de la lista con el clic, o con las flechas y Enter."
            - "Si no aparece, sigue escribiendo para afinar la búsqueda o regístralo con el botón de al lado."
      pending_work:
        show:
          title: "Tareas pendientes"
          summary: "El detalle de lo pendiente que cuenta el Inicio, con el botón para resolver cada cosa."
          steps:
            - "Cada tipo de tarea tiene su pestaña, con cuántas hay; tócala para ver su lista. También se cambia con las flechas del teclado."
            - "Compras sin facturar: van por productor; «Facturar» abre la facturación de ese productor."
            - "Facturas sin cancelar y préstamos vencidos: «Registrar abono» abre el abono encima; «Detalle» muestra el registro."
            - "Períodos de planilla: «Pagar» abre el pago del período."
            - "Empleados sin salario: «Asignar salario» abre el empleado para darle un rol o un salario propio."
          tips:
            - "Al guardar un abono o un salario, la ventana se cierra y el Inicio se actualiza. Vuelve a tocar «Pendientes» para seguir."
            - "Solo ves lo de los módulos a los que tienes acceso, y los botones de lo que puedes hacer."
      coffee_markets:
        show:
          title: "Café en la bolsa"
          summary: "El precio del café arábica en la bolsa de Nueva York (contrato «C» de ICE), en centavos de dólar por libra."
          steps:
            - "La cifra grande es el último precio; al lado, cuánto subió o bajó desde el cierre de la sesión anterior."
            - "La línea muestra el precio de cierre de cada día del último mes."
            - "Toca «Fuente» para ver la cotización completa."
          tips:
            - "Es una referencia del mercado, con unos minutos de retraso. No cambia el precio de las compras, que se escribe en cada una."
            - "Si dice que no está disponible, el servicio de la bolsa no respondió; vuelve a intentar más tarde."
      dashboard:
        show:
          title: "Inicio"
          summary: "El centro de operaciones: cómo va el negocio, lo que necesita atención, lo último que pasó y las acciones de todos los días. Solo ves lo de los módulos a los que tienes acceso."
          steps:
            - "Usa las acciones frecuentes (Registrar compra, Facturar compras, Productores, Préstamos…) para ir directo a lo que necesitas."
            - "«Resumen de operaciones» muestra las compras de hoy, los QQ de la temporada, los préstamos por cobrar y las fincas activas. Toca una cifra para ver su detalle."
            - "Toca la cifra «Pendientes» (o «Ver el detalle») para ver cada tarea pendiente con su botón para resolverla."
            - "«Tareas pendientes» aparece solo cuando hay algo por atender: compras sin facturar, facturas sin cancelar, préstamos vencidos, períodos de planilla por pagar o empleados sin salario. Cada una tiene su botón."
            - "«Café en la bolsa» muestra el precio del café arábica en la bolsa de Nueva York, cuánto cambió en la última sesión y su línea del último mes."
            - "Arriba a la derecha, los círculos son los usuarios: con punto verde, los conectados ahora; con un anillo gris, los que usaron el sistema en la última hora pero ya no tienen la página abierta (celular bloqueado, pestaña cerrada). Pasa el puntero encima para ver el nombre y la hora de su última actividad. Quien cierra sesión sale de la lista."
            - "«Actividad reciente» lista las últimas compras, facturas, productores, préstamos, abonos y pagos de planilla, con su fecha; toca «Abrir» para verlos."
            - "Abajo están tus módulos. Para volver aquí, toca el logo de arriba a la izquierda."
            - "Para salir, usa «Cerrar sesión» (en el celular, dentro de «Menú»)."
            - "Toca tu nombre para abrir «Mi configuración»: ventanas o panel lateral, y el menú arriba o a la izquierda."
          tips:
            - "Si no ves ningún módulo, pídele a un administrador que te asigne permisos."
      administration:
        private_documents:
          index:
            title: "Documentos privados"
            summary: "El pagaré y el contrato de préstamo, con una vista previa de cada uno. Solo para administradores."
            steps:
              - "Revisa la vista previa de cada documento."
              - "Toca «Ver» para leerlo completo o «Editar» para cambiar su texto."
            tips:
              - "Siempre son estos dos: no se agregan ni se borran."
              - "Se imprimen desde el estado de cuenta de cada persona, en Préstamos."
          show:
            title: "Documento privado"
            summary: "El texto del documento como está guardado, con sus variables marcadas."
            steps:
              - "Lee el texto: lo marcado son variables, que al imprimir se llenan con los datos de la persona y del préstamo."
              - "A la derecha están las variables que usa."
              - "Toca «Editar» para cambiarlo."
          form:
            title: "Editar un documento privado"
            summary: "Un editor de texto como el de Word: negrita, alineación, tamaños, listas, tablas y más."
            steps:
              - "Escribe el texto, o pégalo desde Word: conserva el formato."
              - "Pon el cursor donde va un dato y toca su variable en el panel de la derecha (nombre, DNI, monto, plazo…)."
              - "Toca «Guardar»."
            tips:
              - "Una variable se borra entera, como una sola letra."
              - "«Código fuente» (</>) muestra el HTML: sirve para copiar el documento completo, con sus variables, de un sistema a otro."
              - "Si sales con cambios sin guardar, el sistema pregunta antes."
        backups:
          show:
            title: "Respaldo de datos"
            summary: "Descarga una copia de todos los datos para guardarla fuera del servidor. Solo la ve el usuario a cargo de exportar los datos."
            steps:
              - "Revisa «En este servidor»: dice si el respaldo podrá incluir la base de datos completa (base.dump)."
              - "Toca «Descargar respaldo»: baja un .zip con una carpeta que trae base.dump, una carpeta csv/ con una tabla por archivo y LEEME.txt."
              - "Guarda el .zip en un lugar seguro, fuera del servidor (una memoria, la nube del negocio)."
            tips:
              - "Los CSV se abren en Excel y no llevan contraseñas cifradas. base.dump sí trae todo: sirve para restaurar el sistema con pg_restore (los pasos vienen en LEEME.txt)."
              - "Cada descarga queda en la auditoría como «Descargó respaldo»."
        home:
          index:
            title: "Administración"
            summary: "Desde aquí se manejan las personas del negocio y, si eres administrador, los usuarios y la auditoría."
            steps:
              - "Personas: clientes y colaboradores del negocio."
              - "Usuarios: quién entra al sistema y qué puede hacer en cada módulo."
              - "Auditoría: el registro de todo lo que se ha creado, modificado o borrado."
              - "Configuración del sitio: nombre del negocio, ubicación y logo."
        people:
          index:
            title: "Personas"
            summary: "Lista de las personas del negocio. Una misma persona puede ser cliente, colaborador y productor a la vez."
            steps:
              - "Busca por nombre, apellido, DNI o RTN en «Filtros»; también puedes filtrar por rol y departamento."
              - "Toca «Detalle» para ver los datos de una persona."
              - "Toca «Nueva persona» para registrar a alguien."
          show:
            title: "Detalle de la persona"
            summary: "Foto, datos de identidad, contacto, zona, dirección, ubicación en el mapa y roles de la persona. Si es productor, su ficha, lo que ha vendido y sus fincas."
            steps:
              - "Toca «Editar» para cambiar sus datos o sus roles."
              - "Si es productor, «Editar productor» cambia su tipo, clave IHCAFE y fincas; «Detalle» en una finca la abre."
              - "Si la misma persona se registró dos veces, toca «Fusionar con otra persona» (solo administradores)."
              - "Toca «Borrar» para eliminarla; el sistema pide confirmación."
            tips:
              - "Una persona que es productor no se puede borrar."
          form:
            title: "Registrar o editar una persona"
            summary: "Solo los nombres y los apellidos son obligatorios."
            steps:
              - "Si quieres, toca «Foto de perfil» y elige una foto (en el celular puedes tomarla). Se achica sola antes de guardarse."
              - "Escribe nombres y apellidos."
              - "Si los tienes, agrega DNI, RTN, teléfono y correo."
              - "Elige la zona de donde es. Si no existe, toca «Nueva zona»: se abre encima y al guardarla queda elegida."
              - "Para la dirección, elige primero el departamento; después se habilita el municipio."
              - "En «Ubicación en el mapa», toca el mapa donde está para poner el pin (se puede arrastrar), toca «Usar mi ubicación» si estás ahí, o pega las coordenadas de Google Maps en latitud y longitud. Es opcional."
              - "Marca sus roles: cliente, colaborador, productor o varios. Hay que marcar al menos uno. Al marcar «Productor» elige su tipo."
              - "Toca el botón de guardar."
            tips:
              - "DNI: 13 dígitos. RTN: 14 dígitos. Se pueden escribir con guiones o espacios."
              - "El DNI y el RTN no se pueden repetir entre personas."
              - "Teléfono: 8 dígitos, con o sin +504."
              - "Agregar o quitar el rol de productor requiere permiso para crear en Compra de café. Su clave IHCAFE y sus fincas se escriben en el formulario del productor."
              - "No se puede quitar el rol de productor a quien ya tiene compras, facturas o fincas."
        farms:
          index:
            title: "Fincas (Administración)"
            summary: "Todas las fincas, del negocio y de los productores, con su dueño, extensión y ubicación."
            steps:
              - "Busca por nombre o filtra por activas e inactivas en «Filtros»."
              - "Toca «Detalle» (o la fila) para ver una finca; «Editar» para cambiar sus datos."
              - "Toca «Nueva finca» para registrar una, del negocio o de un productor."
            tips:
              - "Una finca con compras o planillas no se borra: se desactiva al editarla."
          show:
            title: "Detalle de la finca"
            summary: "Dueño, extensión, dirección, cuántas compras y planillas la nombran, y su ubicación."
            steps:
              - "Toca «Editar» para cambiar sus datos."
              - "«Borrar» solo aparece si ninguna compra ni planilla la nombra."
              - "«Abrir en Fincas» lleva a su página con planillas y cifras, si tienes permiso de ver Fincas."
          form:
            title: "Registrar o editar una finca"
            summary: "Nombre, dueño, extensión y ubicación de la finca."
            steps:
              - "Escribe el nombre."
              - "Si es la finca de un productor, búscalo en «Productor»; déjalo vacío si es del negocio."
              - "La extensión es opcional: escríbela en manzanas, hectáreas o metros cuadrados y las otras se calculan solas."
              - "Elige departamento y municipio, escribe la dirección y, si quieres, pon el pin en el mapa."
              - "Toca el botón de guardar."
        zones:
          index:
            title: "Zonas (Administración)"
            summary: "Las zonas de donde vienen las personas y las compras, con cuántas personas y compras tiene cada una."
            steps:
              - "Busca una zona por nombre en «Filtros»."
              - "Toca «Editar» para cambiarle el nombre, o «Nueva zona» para crear una."
              - "«Borrar» solo aparece en las zonas que ninguna persona ni compra usa."
          form:
            title: "Registrar o editar una zona"
            summary: "El nombre de la zona; no se puede repetir."
            steps:
              - "Escribe el nombre y toca el botón de guardar."
        producers:
          form:
            title: "Editar productor"
            summary: "Los datos del productor desde su persona: tipo, clave IHCAFE, fincas y datos de la persona."
            steps:
              - "Cambia el tipo o la clave IHCAFE (XX-XX-XXXXX)."
              - "Toca «Agregar finca» para darle otra finca; se crea al guardar."
              - "Cambia los datos de la persona si hace falta y toca el botón de guardar."
        person_merges:
          form:
            title: "Fusionar personas"
            summary: "Junta en una sola a la misma persona registrada dos veces. Solo los administradores pueden hacerlo, y no se deshace."
            steps:
              - "Busca a la otra persona por nombre o DNI y elige cuál queda; toca «Comparar»."
              - "En «Datos que son distintos», marca en cada fila el valor que se queda (nombre, DNI, teléfono, dirección, foto, clave IHCAFE…)."
              - "Revisa lo que pasa a la que queda: compras, facturas, fincas, préstamos y planillas. Las fincas con el mismo nombre se juntan en una."
              - "Toca «Fusionar» y confirma. La otra persona se borra y la fusión queda en la auditoría."
            tips:
              - "Si las dos están en la misma planilla no se pueden fusionar: quita a una de la planilla primero."
        users:
          index:
            title: "Usuarios"
            summary: "Las personas que pueden entrar al sistema. Solo los administradores ven esta pantalla."
            steps:
              - "Busca por nombre o correo, o filtra por tipo y estado, en «Filtros»."
              - "Toca «Detalle» para ver los permisos de un usuario."
              - "Toca «Nuevo usuario» para darle acceso a alguien."
            tips:
              - "Los usuarios no se borran: se desactivan para conservar el registro de lo que hicieron."
          show:
            title: "Detalle del usuario"
            summary: "Muestra el tipo, el estado y los permisos por módulo del usuario."
            steps:
              - "Toca «Editar» para cambiar sus datos, permisos o estado."
              - "Toca «Restablecer contraseña» si la olvidó."
          form:
            title: "Crear o editar un usuario"
            summary: "Cada usuario tiene permisos separados de ver, crear, editar y borrar en cada módulo."
            steps:
              - "Escribe el nombre completo y el correo electrónico."
              - "Al crearlo, define una contraseña de al menos 8 caracteres y confírmala."
              - "Marca «Administrador» solo si debe tener acceso completo y manejar usuarios."
              - "En la tabla de permisos, marca qué puede hacer en cada módulo."
              - "Para quitarle el acceso, edítalo y desmarca «Activo»."
            tips:
              - "Un usuario inactivo no puede entrar, y si tenía una sesión abierta, se cierra."
              - "No se puede desactivar ni quitar el rol de administrador al último administrador activo."
          edit_password:
            title: "Restablecer contraseña"
            summary: "Define una contraseña nueva para el usuario cuando la olvidó."
            steps:
              - "Escribe la contraseña nueva (al menos 8 caracteres)."
              - "Escríbela otra vez para confirmarla."
              - "Guarda y díctale la contraseña al usuario."
            tips:
              - "Se cierran todas las sesiones abiertas del usuario: debe entrar de nuevo."
        audit_events:
          index:
            title: "Auditoría"
            summary: "Registro de todo lo que se crea, modifica o borra, de cada inicio y cierre de sesión, de cada respaldo descargado y de cada error que le salió a un usuario. No se puede modificar ni borrar."
            steps:
              - "Usa «Filtros» para buscar por fechas, usuario, acción, entidad o texto. Elige la acción «Error» para ver solo los errores."
              - "Toca «Detalle» para ver qué campos cambiaron, con su valor antes y después."
            tips:
              - "Las contraseñas nunca se muestran: aparecen como «(oculto)»."
              - "Los bots de internet que buscan direcciones de ataque (/wp-admin, .env…) quedan bloqueados y registrados, pero no salen en la lista: marca «Mostrar bloqueos de bots» para verlos."
          show:
            title: "Detalle de la acción"
            summary: "Quién hizo el cambio, cuándo, desde qué dirección IP y qué campos cambiaron."
            steps:
              - "Revisa la tabla de cambios: cada campo con su valor antes y después."
              - "La referencia de la solicitud es el mismo código que aparece en los mensajes de error."
              - "En un error, «Detalle del error» dice la ruta, la pantalla, el código (404 no encontrado, 403 sin permiso, 500 error inesperado…), el mensaje, los datos enviados (sin contraseñas), el navegador y, en errores del servidor, dónde falló en el código."
        site_settings:
          show:
            title: "Configuración del sitio"
            summary: "El nombre, la ubicación, el RTN y el logo del negocio, y cómo se ven. Solo para administradores."
            steps:
              - "Revisa los datos y la vista previa de la barra y del inicio de sesión."
              - "Toca «Editar» para cambiarlos."
          form:
            title: "Editar la configuración del sitio"
            summary: "Cambia el nombre del negocio, su ubicación, su RTN y su logo."
            steps:
              - "Escribe el nombre como quieres que se vea en la barra y en los impresos."
              - "Escribe la ubicación (opcional)."
              - "Escribe el RTN del negocio (opcional, 14 dígitos): sale en las facturas."
              - "Elige el logo: una imagen PNG, JPG, WebP o GIF de hasta 1 MB. La vista previa muestra cómo queda en la barra."
              - "Toca «Guardar»: se ve en todo el sistema de inmediato."
            tips:
              - "Un logo cuadrado se ve mejor: va dentro de un círculo pequeño."
              - "Para volver al grano de café, marca «Quitar el logo actual»."
      trading:
        home:
          index:
            title: "Resumen de compra de café"
            summary: "El trabajo del día en cuatro pasos. Lo resaltado tiene trabajo pendiente."
            steps:
              - "Pesar y registrar compras: cada pesada es una compra."
              - "Facturar: agrupa las compras sin facturar de un productor en una factura."
              - "Registrar pagos: marca como canceladas las facturas que ya se pagaron."
              - "Cerrar el día: revisa e imprime el cierre diario."
            tips:
              - "Abajo están los totales de hoy y los de la temporada actual (del 1 de septiembre al 31 de agosto)."
              - "Usa las pestañas de arriba para ir a compras, facturas, productores, zonas o el cierre diario."
        purchases:
          index:
            title: "Compras"
            summary: "Lista de compras. Al entrar muestra solo las de hoy."
            steps:
              - "Los filtros se aplican solos al cambiarlos, sin botón: escribe el productor, elige fechas, temporada, zona, estado del café o facturación, y la lista se actualiza sin recargar la página."
              - "Toca un período rápido (Hoy, Ayer, Esta semana, Este mes, Esta temporada o Todo) para cambiar las fechas de un toque."
              - "Los filtros activos salen como etiquetas sobre la lista: toca su × para quitar uno, o «Limpiar todo»."
              - "Toca «Detalle» para ver el cálculo de una compra."
              - "Toca «Anular» para sacar una compra que todavía no está facturada de las listas y los totales."
              - "Toca «Nueva compra» para registrar una sin salir de la lista."
            tips:
              - "Al elegir una temporada se borran las fechas, para ver la temporada completa. Solo salen las temporadas que tienen compras."
              - "Las compras anuladas no aparecen; marca «Mostrar anuladas» en «Filtros» para verlas."
              - "Los totales de arriba nunca cuentan las compras anuladas."
          show:
            title: "Detalle de la compra"
            summary: "Muestra el cálculo completo de la compra y en qué etapa está."
            steps:
              - "Revisa la barra de etapas: registrada, facturada o cancelada."
              - "Usa el botón del siguiente paso: facturar ahora o registrar el pago de su factura."
              - "Si todavía no está facturada, puedes editarla, anularla o borrarla."
            tips:
              - "Si el productor debe préstamos, aparece cuánto debe y el botón «Abonar con esta compra» para descontarlo del pago."
              - "Recién registrada la compra, el botón «Facturar ahora» queda seleccionado: presiona Enter para facturar."
              - "Una compra facturada ya no se puede editar, anular ni borrar."
              - "Una compra anulada queda registrada, pero no cuenta en listas, totales ni facturación."
          form:
            title: "Registrar o editar una compra"
            summary: "Registra una compra, con el peso bruto directo o por pesadas. El sistema calcula sacos, tara, peso neto, quintales y total mientras escribes."
            steps:
              - "Escribe el nombre del productor y elígelo de la lista. Si no existe, toca «¿No está? Registrar productor»."
              - "Si al productor le faltan datos (DNI, RTN, teléfono, correo, zona, dirección o clave IHCAFE), aparece un aviso con cuáles. Toca «Completar datos» para llenarlos en una ventana sin perder la compra."
              - "Revisa la fecha y hora (empieza con la hora actual) y la zona (se cambia a la zona del productor que elijas) y elige el estado del café."
              - "Si quieres, elige la finca: la lista muestra solo las fincas del productor elegido y cambia al cambiar de productor. Si no está, toca «Nueva finca»."
              - "Elige la forma de pesar: «Peso bruto directo» o «Por pesadas»."
              - "Peso bruto directo: escribe el peso bruto. Por pesadas: toca «Agregar pesada» por cada una y escribe su peso y los sacos contados; el peso bruto se llena solo con la suma."
              - "Escribe el precio por libra. En pergamino, revisa la humedad y el daño; en uva, el rendimiento."
              - "Revisa el cálculo y toca el botón de guardar."
            tips:
              - "Al cambiar el estado del café se ponen sus valores iniciales: humedad 51 % en pergamino húmedo, 12 % en pergamino seco; rendimiento 0.186 en uva. Puedes cambiarlos."
              - "Tara con peso bruto directo: 1 libra por cada saco de 165 libras, redondeado hacia arriba."
              - "Tara por pesadas: 1 libra por cada saco contado. Ejemplo: 3 pesadas de 300 lb con 2 sacos cada una dan 900 lb brutas, 6 sacos y 6 lb de tara."
              - "Por pesadas, el peso bruto no se escribe: para cambiarlo, cambia o quita una pesada."
              - "Pergamino: peso neto = (peso bruto − tara) menos el porcentaje de humedad, y a eso se le resta el porcentaje de daño. «Restado por daño» muestra cuántas libras quita el daño y cuánto es en lempiras (libras × precio por libra)."
              - "Uva: peso neto = (peso bruto − tara) × rendimiento."
              - "Quintales (QQ) = peso neto ÷ 125. Total = peso neto × precio por libra."
              - "Cada compra queda en la temporada de su fecha: la temporada empieza el 1 de septiembre."
              - "El cálculo que se guarda es el del sistema; el de la pantalla es una vista previa."
        invoice_payments:
          form:
            title: "Registrar abono a una factura"
            summary: "Un pago al productor por su factura: el saldo completo o una parte."
            steps:
              - "Revisa lo que hay que pagar, lo ya abonado y el saldo."
              - "Escribe el monto: empieza con el saldo completo y puedes bajarlo."
              - "Elige la forma de pago y la fecha, y toca «Registrar abono»."
            tips:
              - "Al registrar el abono se abre su recibo para imprimirlo."
              - "Si el abono no cubre el saldo, la factura queda en «Pago parcial»; cuando lo cubre, pasa a «Cancelada»."
              - "Un abono no puede pasar del saldo ni ser de una fecha anterior a la factura o al último abono."
          show:
            title: "Recibo de pago"
            summary: "El comprobante de un abono a la factura, con original y copia, cada uno en su hoja."
            steps:
              - "Toca «Imprimir»: el original y la copia salen cada uno en su hoja."
              - "El productor firma «Recibí conforme» y quien paga firma «Entregó»."
            tips:
              - "El recibo muestra lo que se pagó, lo abonado hasta ese día y el saldo que quedó."
        haulers:
          index:
            title: "Carreros"
            summary: "Quienes traen el café de los productores con los carros del negocio, y lo que se les debe por comisiones."
            steps:
              - "Busca por nombre, DNI o RTN, o mira los desactivados."
              - "Toca un carrero (o «Detalle») para ver sus compras, sus pagos y lo que se le debe."
              - "Con «Nuevo carrero» registras a uno con su comisión y su precio de la lata."
            tips:
              - "Comisión de cada compra = latas (libras netas ÷ 16.5) × precio de la lata × comisión."
              - "La comisión la paga el negocio aparte: no cambia lo que se le paga al productor."
          show:
            title: "Ficha del carrero"
            summary: "Sus compras carreadas con la comisión de cada una, lo que se le ha pagado y lo que se le debe."
            steps:
              - "Revisa las cifras: comisiones, pagado y lo que se le debe."
              - "Toca «Registrar pago» para pagarle todo o una parte; se abre su recibo para imprimir."
              - "En «Compras que carreó» filtra por temporada; cada una abre su detalle."
            tips:
              - "Cada compra guarda la comisión y el precio de la lata de su día: cambiarlos solo cuenta para las compras nuevas."
              - "Solo se puede quitar el último pago."
          form:
            title: "Registrar o editar un carrero"
            summary: "Su comisión (%), su precio de la lata y sus datos de persona."
            steps:
              - "Escribe la comisión y el precio de la lata: los dos son obligatorios."
              - "Llena sus datos: solo nombres y apellidos son obligatorios."
              - "Toca el botón de guardar."
            tips:
              - "Si la persona ya existe (por ejemplo, es productor), márcale «Carrero» en su formulario de persona en vez de registrarla de nuevo."
              - "Un carrero desactivado ya no sale al registrar compras, pero conserva sus compras y pagos."
        hauler_payments:
          form:
            title: "Registrar pago a un carrero"
            summary: "Un pago de lo que se le debe por comisiones: todo o una parte."
            steps:
              - "Revisa sus comisiones, lo pagado y lo que se le debe."
              - "Escribe el monto: empieza con lo que se le debe y puedes bajarlo."
              - "Elige la forma de pago y la fecha, y toca «Registrar pago»."
            tips:
              - "Al registrarlo se abre su recibo para imprimirlo."
              - "Un pago no puede pasar de lo que se le debe ni ser de una fecha anterior al último pago."
          show:
            title: "Recibo de pago a carrero"
            summary: "El comprobante de un pago al carrero, con original y copia, cada uno en su hoja."
            steps:
              - "Toca «Imprimir»: el original y la copia salen cada uno en su hoja."
              - "El carrero firma «Recibí conforme» y quien paga firma «Entregó»."
            tips:
              - "El recibo muestra lo que se le debía, lo pagado y lo que quedó debiendo el negocio."
        loan_settlements:
          form:
            title: "Abonar préstamos con una compra"
            summary: "Descuenta de lo que se le paga al productor un abono a sus préstamos (pago con café)."
            steps:
              - "Revisa lo que tiene la compra disponible y lo que debe en préstamos."
              - "Revisa la fecha del abono: el interés se calcula hasta esa fecha."
              - "En cada préstamo escribe el monto, o toca «Saldar» para pagarlo completo con lo que alcance."
              - "«Abonar todo lo posible» reparte la compra entre los préstamos, empezando por el que vence primero."
              - "Revisa cuánto va a préstamos y cuánto le queda al productor, y toca «Registrar abonos»."
            tips:
              - "Cada abono paga primero el interés y luego el capital, igual que un abono en efectivo."
              - "La factura muestra los abonos y el total a pagar al productor."
              - "Se puede abonar mientras la compra no esté anulada ni su factura pagada."
              - "Una compra con abonos ya no se edita, anula ni borra; para cambiarla, quita el abono desde su detalle."
        invoices:
          index:
            title: "Facturas"
            summary: "Lista de facturas, las más recientes primero."
            steps:
              - "Los filtros se aplican solos al cambiarlos: busca por productor o número, o elige estado de pago, fechas, temporada (la de sus compras), zona o forma de pago. La lista se actualiza sin recargar la página."
              - "Usa los períodos rápidos (Hoy, Ayer, Esta semana…) y quita un filtro activo con la × de su etiqueta, o todos con «Limpiar todo»."
              - "Toca «Detalle» para ver una factura, imprimirla o registrar su pago."
              - "Toca «Facturar compras» para crear una factura nueva."
          form:
            title: "Facturar compras"
            summary: "Una factura agrupa compras sin facturar de un mismo productor."
            steps:
              - "Elige el productor de la lista de productores con compras sin facturar."
              - "Deja marcadas las compras que van en la factura."
              - "En «Pago», elige si queda pendiente, si se paga completa (cancelada) o si se paga una parte (pago parcial)."
              - "Si se paga algo, elige la forma y la fecha de pago; en pago parcial escribe el monto pagado ahora."
              - "Toca «Crear factura»."
            tips:
              - "Si falta una compra, toca «Nueva compra para este productor»: se registra en una ventana y aparece en la lista."
              - "Si una compra no va, toca «Anular» en su fila: sale de la lista y de los totales."
              - "Las compras facturadas ya no se pueden editar, anular ni borrar."
              - "La lista muestra cuánto restó el daño de cada compra, en libras y en lempiras."
          show:
            title: "Factura"
            summary: "El recibo para el productor, con original y copia."
            steps:
              - "Toca «Imprimir»: el original y la copia salen en hojas separadas."
              - "Al pie firman el cliente (el productor, con su nombre debajo) y el comprador de café."
              - "Si se abonaron préstamos con sus compras, la factura los resta y muestra el total a pagar."
              - "Cuando se le pague al productor, toca «Registrar abono»: puede ser el saldo completo o una parte."
              - "En «Pagos al productor» ves cada abono con su recibo, lo abonado y el saldo. «Ver productor» abre sus datos (teléfono, DNI, dirección…) encima, por si hay que llamarlo. Con abonos que no cubren todo, la factura queda en «Pago parcial»; al cubrir el total pasa a «Cancelada»."
            tips:
              - "Desde la ventana de detalle, «Imprimir» abre la factura en página completa."
              - "En pergamino, «Daño (lb)» y «Daño (L)» muestran lo que el daño restó de cada compra, con su porcentaje; en uva no aplica."
              - "Una factura no se borra; una vez cancelada, ya no cambia."
        producer_cards:
          show:
            title: "Ficha del productor en la compra"
            summary: "La tarjeta que acompaña a «Nueva compra» con los datos del productor elegido."
            steps:
              - "Revisa los QQ y el dinero que ha vendido esta temporada, y su última compra."
              - "Revisa lo que falta facturarle o pagarle."
              - "Si ves Préstamos, revisa lo que debe hoy y su score de pago antes de abonar con café."
        producers:
          index:
            title: "Productores"
            summary: "Productores, carreros (intermediarios) y fincas propias a quienes se les compra café."
            steps:
              - "Busca por nombre, apellido, DNI, RTN o clave IHCAFE; también puedes filtrar por tipo y zona."
              - "La lista muestra los QQ de la temporada y la última compra de cada uno."
              - "Toca «Detalle» para ver su ficha, lo que tiene pendiente, sus compras y sus facturas."
              - "Toca «Nuevo productor» para registrar uno."
          show:
            title: "Detalle del productor"
            summary: "Todo lo del productor en una pantalla: lo que ha vendido, su ficha, lo pendiente, sus préstamos, sus compras y sus facturas."
            steps:
              - "Arriba están fijos los QQ, las compras, el total y el precio promedio por libra de la temporada actual, los QQ de todas las temporadas y, si ves préstamos, lo que debe hoy."
              - "La ficha tiene su clave IHCAFE, DNI, RTN, teléfono, correo, dirección y las fechas de su primera y última compra."
              - "«Pendiente» muestra las compras sin facturar y las facturas pendientes de pago, con un botón para atenderlas."
              - "«Resumen» compara sus temporadas, muestra lo comprado cada mes y qué estados del café vende."
              - "En «Compras» y «Facturas» están las listas completas, con filtros."
            tips:
              - "Los QQ y totales no cuentan las compras anuladas."
              - "El precio promedio por libra es el total comprado entre las libras netas: mezcla todos los estados del café."
              - "Toca el teléfono o el correo para llamar o escribir desde el celular."
              - "Si lo abriste desde la lista, toca «Ver detalle completo» para verlo en página completa."
          form:
            title: "Registrar o editar un productor"
            summary: "Datos de compra del productor y sus datos personales."
            steps:
              - "Elige el tipo: productor, intermediario o finca propia."
              - "En «Fincas», la lista muestra las fincas del productor. Toca «Agregar finca», escribe el nombre y toca «Agregar»: sale en la lista como «(nueva)» y se crea al guardar el productor. «Quitar esta» saca una nueva antes de guardar. Si ya tiene una con ese nombre (aunque esté escrita con otras mayúsculas), se usa esa."
              - "Si tiene clave del IHCAFE, escríbela con el formato XX-XX-XXXXX (letras o números). Puedes escribirla sin guiones o en minúsculas: se guarda en mayúsculas y con guiones. No se puede repetir entre productores."
              - "Escribe nombres y apellidos; el resto de datos es opcional."
              - "Si quieres, toca «Foto de perfil» y elige una foto (en el celular puedes tomarla). Se achica sola antes de guardarse."
              - "Elige su zona. Si la zona no existe, toca «Nueva zona»: se abre encima y al guardarla queda elegida."
              - "En «Ubicación en el mapa», toca el mapa donde está para poner el pin (se puede arrastrar), toca «Usar mi ubicación» si estás ahí, o pega las coordenadas de Google Maps en latitud y longitud. Es opcional."
              - "En «Roles», «Productor» ya va marcado; marca también «Cliente» o «Colaborador» si lo es."
              - "Toca el botón de guardar."
            tips:
              - "Si lo registras desde una compra, al guardar queda elegido en esa compra sin perder lo que ya escribiste."
              - "Cada productor también aparece en Administración → Personas."
        zones:
          index:
            title: "Zonas"
            summary: "Los lugares de donde vienen los productores."
            steps:
              - "Busca una zona por nombre en «Filtros»."
              - "Toca «Nueva zona» para agregar una, o «Editar» para cambiarle el nombre."
          form:
            title: "Crear o editar una zona"
            summary: "Una zona solo tiene nombre."
            steps:
              - "Escribe el nombre de la zona."
              - "Toca el botón de guardar."
            tips:
              - "Si la creas desde una compra, al guardar queda elegida en esa compra."
        daily_closes:
          show:
            title: "Cierre diario"
            summary: "Resumen y detalle de las compras de un día."
            steps:
              - "Elige la fecha: el cierre se actualiza solo."
              - "Revisa los totales y «Estado de pago»: cuánto del total comprado está en facturas canceladas, con pago parcial, pendientes de pago y sin facturar, con su barra."
              - "En «Facturas con pago parcial» ves lo abonado y lo que falta de cada una; toca «Detalle» para registrar otro abono."
              - "En «Por productor» ves lo que vendió cada productor ese día; toca su nombre para ver sus compras."
              - "Toca «Imprimir» para sacar el reporte."
            tips:
              - "«Compras del día» y el reporte impreso agrupan las compras en canceladas, con pago parcial, pendientes de pago y sin facturar, cada grupo con su total."
              - "El productor que más vendió en el día sale primero."
      sales:
        home:
          index:
            title: "Resumen de comercialización"
            summary: "La venta del café en cuatro pasos, el café en inventario y cómo van el día y la temporada."
            steps:
              - "Registrar salidas: cada camión que sale con café para un comprador."
              - "Pesar en destino: el peso que da la báscula del comprador."
              - "Vender: agrupa las salidas pesadas de un comprador en una venta."
              - "Cobrar: registra lo que paga el comprador."
            tips:
              - "El inventario sube con cada compra y baja con cada salida, en libras netas por estado del café."
              - "Si hay salidas con una diferencia de peso mayor a la tolerancia, sale un aviso con el enlace a ellas."
        shipments:
          index:
            title: "Salidas de camiones"
            summary: "Cada camión que salió con café, con su peso local, su peso en destino y la diferencia."
            steps:
              - "Los filtros se aplican solos: busca por comprador, número, remisión, nota de peso o transportista, o elige fechas, temporada, comprador, estado del café o estado de la salida."
              - "Toca una fila para ver la salida y registrar su peso en destino."
              - "Toca «Nueva salida» para registrar un camión."
            tips:
              - "Las salidas anuladas no aparecen; elige el estado «Anulada» para verlas."
              - "Con tolerancia configurada, «Solo con diferencia mayor…» deja las que se pasaron."
          show:
            title: "Detalle de la salida"
            summary: "Las dos pesadas lado a lado, la diferencia y en qué etapa está."
            steps:
              - "Revisa la barra de etapas: salió, pesada en destino, vendida, cobrada."
              - "Usa el botón del siguiente paso: registrar el peso en destino, vender o ver la venta."
              - "Mientras no esté en una venta, puedes editarla o anularla."
            tips:
              - "Anular una salida devuelve su café al inventario."
          form:
            title: "Registrar o editar una salida"
            summary: "El camión que sale: comprador, papeles y el peso en la báscula local. El sistema calcula la tara, el peso neto y los QQ mientras escribes."
            steps:
              - "Elige el comprador (o «Nuevo comprador»), la fecha y hora y el estado del café."
              - "Escribe la remisión, el transportista y la placa si los tienes."
              - "Escribe el peso bruto y los sacos contados. En pergamino, revisa la humedad y el daño; en uva, el rendimiento."
              - "Revisa el cálculo y guarda."
            tips:
              - "Tara: 1 libra por saco contado. Neto: como en las compras."
              - "Si sale más café del que hay en inventario de ese estado, aparece un aviso; se puede guardar igual."
        arrivals:
          form:
            title: "Peso en destino"
            summary: "El peso que dio la báscula del comprador, con su nota de peso."
            steps:
              - "Escribe la fecha y el número de la nota de peso."
              - "Copia el peso bruto, los sacos, la humedad y el daño (o el rendimiento) de la nota."
              - "Revisa la diferencia con la báscula local y guarda."
            tips:
              - "La venta se cobra con este peso."
              - "Si la diferencia pasa la tolerancia, el recuadro se marca en rojo."
        sales:
          index:
            title: "Ventas"
            summary: "Las ventas de café con su total, lo cobrado y lo que falta."
            steps:
              - "Filtra por fechas, temporada, comprador, estado del café o estado de cobro; la lista se actualiza sola."
              - "Toca una fila para ver la venta, registrar un cobro o imprimirla."
              - "Toca «Nueva venta» para vender salidas ya pesadas en destino."
            tips:
              - "Las ventas anuladas no cuentan en los totales; elige «Anuladas» para verlas."
          show:
            title: "Detalle de la venta"
            summary: "La nota de venta con sus salidas, el peso de cada báscula, el total y los cobros."
            steps:
              - "Toca «Registrar cobro» por cada pago del comprador."
              - "Toca «Imprimir» para sacar la nota de venta (original y copia)."
              - "Mientras no tenga cobros, puedes anularla con su motivo."
            tips:
              - "Al anular, sus salidas quedan libres para otra venta."
          form:
            title: "Nueva venta"
            summary: "Agrupa salidas de un comprador, ya pesadas en destino, en una venta."
            steps:
              - "Elige el comprador."
              - "Marca sus salidas (todas del mismo estado del café)."
              - "Escribe la fecha, si el precio es por quintal (100 lb) o por libra, y el precio."
              - "Escribe el número de la factura o comprobante del comprador."
              - "Elige el cobro: a crédito, parcial o de contado, y guarda."
            tips:
              - "Total = libras netas del comprador ÷ 100 × precio por quintal, o libras × precio por libra."
              - "La columna de la derecha muestra el total y la diferencia de peso mientras eliges."
        sale_payments:
          show:
            title: "Recibo de cobro"
            summary: "El recibo de un cobro: lo que pagó el comprador y lo que falta."
            steps:
              - "Toca «Imprimir»: sale el original y la copia, cada uno en su hoja."
          form:
            title: "Registrar cobro"
            summary: "Un pago del comprador sobre una venta."
            steps:
              - "Escribe el monto (empieza con lo que falta), la forma de pago y la fecha."
              - "Guarda: se abre el recibo listo para imprimir."
            tips:
              - "No puede pasar de lo que falta ni ir antes de la venta o del último cobro."
        buyers:
          index:
            title: "Compradores"
            summary: "Exportadoras, beneficios y otros compradores, con lo enviado, lo vendido y lo que deben."
            steps:
              - "Busca por nombre, RTN o contacto; filtra por tipo o estado."
              - "Toca una fila para ver sus ventas, salidas y cobros."
              - "Toca «Nuevo comprador» para registrar uno."
          show:
            title: "Ficha del comprador"
            summary: "Sus datos, sus cifras y, en pestañas, sus ventas, salidas y cobros."
            steps:
              - "Usa las pestañas para ver ventas, salidas o cobros; filtra por temporada."
              - "«Nueva salida» y «Nueva venta» empiezan con este comprador."
          form:
            title: "Registrar o editar un comprador"
            summary: "Nombre o razón social, tipo, RTN, contacto y dirección."
            steps:
              - "Escribe el nombre y elige el tipo: exportador, beneficio u otro."
              - "Agrega RTN, contacto, teléfono, correo y dirección si los tienes."
            tips:
              - "Un comprador con salidas no se borra: se desactiva y deja de salir en las salidas nuevas."
        stocks:
          show:
            title: "Inventario"
            summary: "El café en inventario por estado y sus movimientos."
            steps:
              - "Arriba, el saldo de hoy por estado del café, en libras netas y QQ."
              - "Abajo, cada compra que entró y cada salida que se fue en las fechas elegidas, con el saldo después de cada una."
            tips:
              - "Las compras y salidas anuladas no cuentan."
        daily_closes:
          show:
            title: "Cierre diario de comercialización"
            summary: "Lo que salió, lo que se pesó en destino, lo que se vendió y se cobró en un día, y el inventario al cerrar."
            steps:
              - "Elige la fecha."
              - "Revisa las cifras, el inventario y las listas del día."
              - "Toca «Imprimir» para sacar el cierre."
      finance:
        home:
          index:
            title: "Resumen de Control financiero"
            summary: "Dónde está el dinero, lo que salió este mes contra el pasado, el presupuesto del mes y los últimos movimientos."
            steps:
              - "Arriba, los avisos: movimientos sin cuenta y categorías que pasaron su presupuesto."
              - "Las tarjetas de cuentas abren su estado de cuenta."
              - "«Por dónde salió» y «Por categoría» muestran en qué se fue el dinero del mes."
        movements:
          index:
            title: "Movimientos de dinero"
            summary: "Todo el dinero que entró o salió, de todos los módulos."
            steps:
              - "Filtra por fechas, cuenta, origen, entrada o salida, o busca por detalle."
              - "Al elegir una cuenta salen sus transferencias y el saldo después de cada movimiento."
              - "Toca «Abrir» para ir al registro en su módulo."
        expenses:
          index:
            title: "Gastos e inversiones"
            summary: "Lo que el negocio gasta o invierte, con su categoría, cuenta y comprobante."
            steps:
              - "Filtra por fechas, categoría, cuenta o forma de pago; la lista se actualiza sola."
              - "Toca una fila para ver el detalle y el comprobante."
          show:
            title: "Detalle del gasto o inversión"
            summary: "Sus datos y la foto o el PDF del comprobante."
            steps:
              - "Toca «Editar» para cambiarlo o «Borrar» para quitarlo."
          form:
            title: "Registrar un gasto o inversión"
            summary: "Detalle, categoría, beneficiario, fecha, monto, forma de pago, cuenta y comprobante."
            steps:
              - "Escribe el detalle y elige la categoría (o «Nueva categoría»)."
              - "Escribe la fecha y el monto; al elegir la forma de pago se sugiere su cuenta."
              - "Si quieres, adjunta la foto o el PDF del comprobante."
            tips:
              - "La foto o el PDF puede pesar hasta 1 MB."
        expense_receipts:
          show:
            title: "Comprobante"
            summary: "La foto o el PDF del comprobante de un gasto."
            steps:
              - "Se abre en el navegador; desde ahí se puede guardar o imprimir."
        money_accounts:
          index:
            title: "Cuentas"
            summary: "La caja y los bancos, con su saldo de hoy."
            steps:
              - "Toca una cuenta para ver su estado de cuenta."
              - "«Nueva cuenta» registra una con su saldo inicial."
          show:
            title: "Estado de cuenta"
            summary: "Los movimientos de una cuenta con el saldo después de cada uno."
            steps:
              - "Elige las fechas; arriba el saldo al empezar y al terminar."
              - "«Otro ingreso» y «Transferir» registran dinero que entra o pasa a otra cuenta."
              - "«Imprimir estado de cuenta» lo saca con el membrete."
          form:
            title: "Registrar o editar una cuenta"
            summary: "Nombre, tipo, banco, número, saldo inicial y para qué forma de pago se sugiere."
            steps:
              - "Escribe el nombre y elige si es caja o banco."
              - "Escribe el saldo con que empieza en el sistema y su fecha."
              - "Marca las formas de pago para las que se sugiere al registrar un pago."
        account_transfers:
          form:
            title: "Transferir entre cuentas"
            summary: "Dinero que pasa de una cuenta a otra del negocio."
            steps:
              - "Elige de qué cuenta sale y a cuál entra, el monto y la fecha, y guarda."
        other_incomes:
          form:
            title: "Otro ingreso"
            summary: "Dinero que entra a una cuenta fuera de los módulos."
            steps:
              - "Escribe el concepto, el monto y la fecha; elige la forma de pago y la cuenta, y guarda."
        categories:
          index:
            title: "Categorías"
            summary: "Las categorías de gastos e inversiones, en dos niveles."
            steps:
              - "«Agregar subcategoría» crea una dentro de una de primer nivel."
              - "Una categoría usada no se borra: se desactiva."
          form:
            title: "Registrar o editar una categoría"
            summary: "Nombre, tipo (gasto o inversión) y, para una subcategoría, su categoría de primer nivel."
            steps:
              - "Escribe el nombre y elige el tipo."
              - "Para una subcategoría, elige su categoría de primer nivel."
        consolidations:
          show:
            title: "Consolidación"
            summary: "Los pagos y cobros de los otros módulos que se registraron sin cuenta, para asignarles una."
            steps:
              - "Filtra por fechas, origen o busca por detalle o persona."
              - "Marca los movimientos (o «Marcar todos»)."
              - "Elige la cuenta y toca «Asignar a los marcados», o toca «Asignar la cuenta de su forma de pago» para que cada uno tome la que se sugiere para su forma de pago."
            tips:
              - "Solo cambia la cuenta; el pago queda como estaba y el cambio queda en la auditoría."
              - "Los gastos, inversiones, otros ingresos y transferencias siempre llevan cuenta: no salen aquí."
        budgets:
          show:
            title: "Presupuesto"
            summary: "Lo que se piensa gastar por categoría y mes, contra lo gastado."
            steps:
              - "Elige la temporada."
              - "Escribe el presupuesto de cada categoría en cada mes y guarda."
            tips:
              - "Lo gastado sale en rojo cuando pasa el presupuesto."
      farms:
        home:
          index:
            title: "Resumen de fincas"
            summary: "Lo que hay que pagar y, en tarjetas, cada planilla activa con su período de hoy."
            steps:
              - "Revisa «Por pagar»: períodos que terminan hoy o antes y no se han pagado, con su monto."
              - "Toca «Pagar» para pagar un período, o «Abrir planilla» para revisarla antes."
              - "Cada tarjeta muestra el período actual, su día de pago (y cuántos días faltan), lo que lleva y los empleados. La que se paga primero sale primero."
              - "Toca «Asistencia de hoy» o «Latas de hoy» para registrar el trabajo del día en un toque; en una planilla por obra, «Nueva tarea»."
              - "Toca «Nueva planilla» para crear una."
            tips:
              - "Semanal se paga cada sábado; quincenal, el 15 y el último día del mes; mensual, el último día del mes."
        farms:
          index:
            title: "Fincas"
            summary: "Las fincas del negocio. Cada una tiene sus planillas."
            steps:
              - "Busca por nombre o filtra por activas e inactivas en «Filtros»."
              - "Toca «Abrir» (o cualquier parte de la fila) para ir a la finca: sus planillas y lo que han costado."
              - "Toca «Nueva finca» para registrar una."
            tips:
              - "Una finca no se borra: se desactiva y deja de aparecer al crear planillas."
          show:
            title: "Detalle de la finca"
            summary: "La finca, lo que han costado sus planillas, el café que se le compró, lo cortado, su rendimiento por manzana y hectárea, y la lista de sus planillas."
            steps:
              - "Revisa las cifras: pagado en planillas, gastos y costo total de la finca."
              - "En «Café vendido de la finca» ves los QQ, el valor, las compras y el precio promedio por libra de las compras que nombran esta finca."
              - "Si la finca tiene planillas de corte, «Corte de café» muestra las latas cortadas, lo pagado por latas, los días de corte y los cortadores."
              - "Con la extensión escrita, «Rendimiento por extensión» divide los QQ, el dinero y las latas entre las manzanas y hectáreas de la finca."
              - "«Lo generado contra lo gastado» compara el valor del café con lo que costaron planillas y gastos, y da el costo por QQ."
              - "Filtra sus planillas por nombre, tipo o estado: se aplican solas y la lista se actualiza sin recargar. Quita un filtro con la × de su etiqueta."
              - "Toca «Nueva planilla» para crear una en esta finca, o «Abrir» en una planilla para entrar a ella."
            tips:
              - "Arriba, «Fincas ›» te regresa a la lista de fincas."
              - "Las cifras son de todas las fechas. Para verlas por período o comparar fincas, usa «Comparar fincas y ver por período en Reportería»."
          form:
            title: "Registrar o editar una finca"
            summary: "Nombre, dueño, extensión y ubicación de la finca."
            steps:
              - "Escribe el nombre."
              - "La extensión es opcional: escríbela en manzanas, hectáreas o metros cuadrados, la que prefieras, y las otras se calculan solas. Se guarda como la escribiste."
              - "Si es la finca de un productor, búscalo en «Productor»; déjalo vacío si es una finca del negocio. El dueño ya no cambia cuando la finca tiene compras o planillas."
              - "Elige departamento y municipio y escribe la dirección."
              - "En «Ubicación en el mapa», toca el mapa donde está para poner el pin (se puede arrastrar), toca «Usar mi ubicación» si estás ahí, o pega las coordenadas de Google Maps en latitud y longitud. Es opcional."
              - "Toca el botón de guardar."
        payrolls:
          index:
            title: "Planillas"
            summary: "Todas las planillas. Al entrar muestra las activas y las que todavía no empiezan («Por iniciar»)."
            steps:
              - "Filtra por nombre, finca, tipo o estado: se aplican solos al cambiarlos y la lista se actualiza sin recargar. Quita un filtro con la × de su etiqueta o todos con «Limpiar todo»."
              - "Toca «Abrir» para ver la planilla: períodos de pago, empleados, tareas y gastos."
              - "Toca «Nueva planilla» para crear una."
          show:
            title: "Planilla"
            summary: "Todo de una planilla: sus cuentas arriba y, en pestañas, los períodos de pago, los empleados, las tareas (por obra) y los gastos."
            steps:
              - "Arriba están las cuentas: pagado, lo que fue a préstamos, gastos, costo total y lo que falta por pagar."
              - "En «Empleados» crea los roles con su salario por día y agrega a los colaboradores que trabajan."
              - "En «Préstamos» ves lo que debe hoy cada empleado, abres su estado de cuenta y registras un abono a cualquiera de sus préstamos (solo si tienes permiso en Préstamos)."
              - "Registra el trabajo: «Asistencia» (por día), «Latas» (corte de café) o «Nueva tarea» (por obra)."
              - "En «Períodos de pago», el período de hoy sale arriba con lo que lleva, su día de pago y sus botones. Toca «Pagar» cuando termine."
              - "Toca un estado (Sin pagar, Pagados, Próximos) para ver solo esos períodos; cada uno dice cuántos tiene."
              - "Arriba, la ruta (Fincas › la finca › la planilla) te lleva a la finca o a la lista de fincas. Las pestañas cambian sin recargar la página."
              - "Registra los gastos con «Registrar gasto»."
            tips:
              - "Un período pagado queda cerrado: su asistencia, latas o tareas ya no se cambian."
              - "Solo se puede quitar el pago del último período."
          form:
            title: "Crear o editar una planilla"
            summary: "Una planilla de una finca: su nombre, cómo se paga y cada cuánto."
            steps:
              - "Elige la finca (o créala con «Nueva finca») y escribe el nombre."
              - "Elige el tipo: por día, por obra (tarea) o corte de café (por lata)."
              - "Elige cada cuánto se paga y la fecha de inicio. La fecha de fin es opcional."
              - "En corte de café, escribe el precio de la lata."
              - "Si se pagan horas extra, escribe el valor de la hora extra (opcional; no aplica a planillas por obra). Sin ese valor no se anotan horas extra."
              - "Toca el botón de guardar y después agrega a los empleados."
            tips:
              - "Semanal: períodos que terminan cada sábado. Quincenal: del 1 al 15 y del 16 al fin de mes. Mensual: el mes completo."
              - "El primer período empieza en la fecha de inicio y va hasta el siguiente día de pago. Si la planilla empieza un sábado (o un 15, o fin de mes), ese día se paga con el período siguiente."
              - "Los períodos por venir aparecen como «Próximo» hasta la fecha de fin."
              - "Una obra de un día (o de unas horas): pon la misma fecha de inicio y de fin. Ese día se paga."
              - "Al cambiar la frecuencia o las fechas, los períodos sin pagar se recalculan; los pagados se quedan como están."
              - "Las fechas no pueden dejar fuera días con trabajo o pagos ya registrados. Con pagos, el tipo ya no se cambia."
        roles:
          form:
            title: "Crear o editar un rol"
            summary: "Un rol de la planilla con su salario por día. En corte de café, el rol es para los caporales, que no cortan y ganan por día."
            steps:
              - "Escribe el nombre del rol y su salario por día."
              - "Toca el botón de guardar."
            tips:
              - "Un empleado con salario propio gana ese salario en vez del de su rol."
              - "Lo ya pagado no cambia si cambias el salario."
        members:
          form:
            title: "Agregar o editar un empleado"
            summary: "Un colaborador que trabaja en la planilla."
            steps:
              - "Busca al colaborador por nombre o DNI y elígelo. Si no existe, toca «¿No está? Registrar colaborador»."
              - "En planillas por día, elige su rol o escribe un salario propio. En corte de café, los cortadores van sin rol (ganan por latas) y los caporales con su rol o salario (ganan por día)."
              - "Toca el botón de guardar."
            tips:
              - "El salario propio manda sobre el del rol."
              - "Si ya trabajó, no se quita: se desactiva y deja de aparecer en la asistencia."
              - "En planillas por día, la misma persona puede estar otra vez con otro rol (por ejemplo, chofer unos días y jornalero otros): agrégala de nuevo eligiendo el otro rol, o toca «Otro rol» en la lista de empleados. Con el mismo rol no se repite."
        timesheets:
          show:
            title: "Asistencia o latas"
            summary: "Lo que trabajó cada empleado cada día del período: días (planillas por día) o latas (corte de café). En corte, los caporales van aparte con su asistencia."
            steps:
              - "Elige el período con «Anterior», «Siguiente», la lista o «Hoy»; o un solo día (más cómodo en el celular)."
              - "Por día: toca cada casilla para pasar de — (no vino) a 1 (día completo) y a ½. «Todos» llena un día para todos y «Todo el período» todos los días de una persona. En corte: escribe las latas, de cuarto en cuarto (0.25, 0.50, 0.75, 1, 1.25…)."
              - "Al final de la fila de quien gana por día (también los caporales del corte) escribe sus horas extra y días extra del período: las horas se pagan al valor de la hora extra de la planilla y los días, a su salario por día. «A pagar» ya las suma."
              - "Toca «Guardar» en la barra de abajo, que siempre está a la vista. Te avisa si tienes cambios sin guardar, y si sales sin guardar te pregunta antes."
              - "Cuando el período llegue a su día de pago, «Pagar este período» se resalta. «Ver la planilla» (o la ruta de arriba) te regresa a la planilla."
            tips:
              - "En el celular, elige un día arriba para ver solo esa columna."
              - "Si una persona está en dos roles, sale en dos filas (su rol bajo el nombre). Cada día se marca en una sola de ellas: si lo marcas en las dos, no se guarda y te dice en cuál ya estaba."
              - "Un período pagado ya no se puede cambiar."
              - "Para pagar, toca «Pagar este período»."
        tasks:
          form:
            title: "Registrar o editar una tarea"
            summary: "Una tarea de una planilla por obra: su valor se divide en partes iguales entre quienes la hicieron."
            steps:
              - "Escribe el nombre de la tarea y elige cómo se paga: monto fijo, por manzana, por barril (fumigación, foliar) o por abono aplicado."
              - "Con monto fijo, escribe su valor. Si no, escribe la cantidad (manzanas trabajadas, barriles con sus litros, o quintales o libras de abono) y su precio: el valor se calcula solo."
              - "Marca a los empleados que la hicieron: se muestra cuánto le toca a cada uno."
              - "Cuando esté terminada, escribe la fecha. Se paga en el período de esa fecha."
              - "Toca el botón de guardar."
            tips:
              - "Ejemplo: una tarea de L 1,000 hecha entre 4 personas da L 250 a cada una."
              - "Ejemplo: 10 barriles × L 100 = L 1,000. El precio es por barril; los litros del barril solo se anotan."
              - "Por manzana, la finca debe tener su extensión: si no la tiene, el formulario la pide y se guarda en la finca. No se pagan más manzanas que las que tiene la finca."
              - "Si la división no da exacta, los centavos que sobran van uno a uno a los primeros de la lista."
              - "Una tarea pagada ya no se edita ni se borra."
        payments:
          form:
            title: "Pagar un período"
            summary: "Lo que gana cada empleado en el período y, si debe préstamos, cuánto descontarle."
            steps:
              - "Revisa lo que gana cada empleado: días, latas o tareas, más sus horas y días extra si los tiene."
              - "Si alguien debe, escribe cuánto descontarle de cada préstamo o toca «Saldar». «Estado de cuenta» muestra todos sus préstamos y abonos antes de decidir."
              - "Revisa los totales: planilla, a préstamos y a entregar."
              - "Toca «Registrar pago» y luego imprime la planilla de pago para las firmas."
            tips:
              - "Lo descontado no puede pasar de lo que gana la persona."
              - "Quien trabajó en varios roles sale en una sola tarjeta con lo de cada rol; sus préstamos se descuentan una vez, del total. En la planilla de pago sale una línea por rol."
              - "Cada descuento es un abono al préstamo: paga primero el interés y luego el capital."
              - "Al pagar, el período queda cerrado."
          show:
            title: "Planilla de pago"
            summary: "Lo que se pagó en un período, con una línea por empleado para su firma."
            steps:
              - "Toca «Imprimir» y que cada empleado firme al recibir."
              - "«Volver a la planilla» (o la ruta de arriba) te regresa a sus períodos."
            tips:
              - "Solo se puede quitar el pago del último período; también se quitan sus abonos a préstamos."
        expenses:
          form:
            title: "Registrar o editar un gasto"
            summary: "Un gasto de la planilla, para su contabilidad."
            steps:
              - "Revisa la fecha y elige la categoría (o crea una con «Nueva categoría»)."
              - "Escribe la descripción y el monto."
              - "Toca el botón de guardar."
        expense_categories:
          index:
            title: "Categorías de gastos"
            summary: "Las categorías para agrupar los gastos de las planillas."
            steps:
              - "Busca por nombre o filtra por activas e inactivas."
              - "Toca «Nueva categoría» para crear una."
            tips:
              - "Una categoría no se borra: se desactiva."
          form:
            title: "Crear o editar una categoría de gasto"
            summary: "El nombre de la categoría."
            steps:
              - "Escribe el nombre y toca el botón de guardar."
      loans:
        document_prints:
          form:
            title: "Revisar e imprimir un documento"
            summary: "El pagaré o el contrato del préstamo, lleno con los datos de la persona y del préstamo, antes de imprimirlo."
            steps:
              - "Revisa el documento: así saldrá en papel."
              - "Si falta algún dato, el aviso dice cuál. «Completar datos de la persona» abre su ficha encima; al guardar, el documento se vuelve a llenar."
              - "Toca «Imprimir»: se abre la ventana de impresión."
            tips:
              - "Cada impresión cuenta en el préstamo, al lado de su botón."
          show:
            title: "Documento impreso"
            summary: "El documento tal como salió: con los datos de ese día."
            steps:
              - "Revisa el documento; la ventana de impresión se abre sola al llegar aquí."
              - "«Imprimir de nuevo» lo vuelve a imprimir (y cuenta otra vez)."
              - "«Volver al préstamo» regresa al préstamo."
        home:
          index:
            title: "Resumen de préstamos"
            summary: "Lo que hay por cobrar hoy y los préstamos vencidos."
            steps:
              - "Revisa las cifras: préstamos por cobrar, capital, interés acumulado y vencidos."
              - "En «Préstamos vencidos» toca «Detalle» para ver un préstamo y registrarle un abono."
              - "Usa las pestañas de arriba para prestar, ver todos los préstamos o los estados de cuenta."
        loans:
          index:
            title: "Préstamos"
            summary: "Todos los préstamos, los más recientes primero, con lo que debe hoy cada uno."
            steps:
              - "Filtra por fechas del préstamo, por persona o por estado: al día, vencido o pagado."
              - "Toca «Detalle» para ver el préstamo, sus abonos y registrar uno nuevo."
              - "Toca «Nuevo préstamo» para prestar."
          show:
            title: "Detalle del préstamo"
            summary: "Cuánto se prestó (efectivo e insumos), cuánto debe hoy y cada abono con lo que fue a interés y a capital."
            steps:
              - "Revisa «Debe hoy»: el capital pendiente más el interés acumulado hasta hoy."
              - "Toca «Registrar abono» cuando la persona pague."
              - "Toca «Estado de cuenta» para ver todos los préstamos de esa persona y su score."
            tips:
              - "Un préstamo con abonos ya no se puede editar ni borrar."
              - "Solo se puede quitar el último abono, por si se registró mal."
              - "Los abonos «Con café» se hicieron desde una compra: dicen de qué compra salieron."
          form:
            title: "Registrar o editar un préstamo"
            summary: "Se le puede prestar a cualquier persona: clientes, colaboradores o productores. Se presta efectivo, insumos o los dos."
            steps:
              - "Escribe el nombre de la persona y elígela de la lista. Si no existe, toca «¿No está? Registrar persona»."
              - "En «Qué se presta», escribe el efectivo (déjalo vacío si solo son insumos)."
              - "Para prestar insumos, toca «Agregar insumo», elígelo y escribe la cantidad. El precio se pone solo y lo puedes cambiar."
              - "Revisa el resumen: efectivo, insumos y capital del préstamo."
              - "Escribe la tasa de interés mensual, revisa la fecha del préstamo y elige la fecha límite."
              - "Toca el botón de guardar."
            tips:
              - "El capital es el efectivo más el valor de los insumos; el interés corre sobre todo el capital."
              - "Si el insumo no está en la lista, toca «Nuevo insumo»: se abre encima y al guardarlo queda en la línea."
              - "Para quitar una línea de insumo, toca «Quitar»."
              - "La tasa se define en cada préstamo; puede ser 0 si no cobra interés."
              - "La fecha límite cuenta para el score de pago de la persona."
              - "«Plazo (días)»: escribe los días y la fecha límite se llena sola; si eliges la fecha límite, salen los días. Al cambiar la fecha del préstamo, la fecha límite se mueve con el mismo plazo."
              - "Al elegir la persona, a la derecha (abajo en el celular) sale su ficha: contacto, lo que debe hoy, su score de pago y sus préstamos por cobrar; si es productor, el café que ha vendido esta temporada."
        borrowers:
          show:
            title: "Ficha de la persona"
            summary: "La tarjeta que acompaña al formulario del préstamo con los datos de la persona elegida."
            steps:
              - "Revisa sus datos de contacto y sus roles."
              - "Revisa lo que debe hoy, su score de pago y sus préstamos por cobrar antes de prestarle otra vez."
              - "Si es productor, revisa el café que ha vendido esta temporada y lo que todavía falta facturarle o pagarle."
              - "Toca «Estado de cuenta» o «Ficha del productor» para ver todo el detalle."
        payments:
          form:
            title: "Registrar un abono"
            summary: "Registra un pago de la persona. El sistema lo reparte entre interés y capital."
            steps:
              - "Revisa lo que debe hoy: capital, interés y total."
              - "Revisa la fecha del abono y escribe el monto."
              - "Elige la forma de pago y toca «Registrar abono»."
            tips:
              - "El abono paga primero el interés acumulado; lo que sobra baja el capital."
              - "No puede ser mayor que lo que se debe a esa fecha."
              - "No puede llevar una fecha anterior al último abono."
              - "Si el abono cubre todo, el préstamo queda pagado."
              - "Al registrarlo se abre su recibo, listo para imprimir."
          show:
            title: "Recibo de abono"
            summary: "Comprobante de un abono: cuánto se pagó, a qué se aplicó y cuánto quedó debiendo la persona."
            steps:
              - "Revisa los datos del abono y el saldo que quedó después de él."
              - "Toca «Imprimir recibo»: el original y la copia salen cada uno en su hoja."
              - "Entrega el original a la persona y guarda la copia firmada."
            tips:
              - "El saldo es el de la fecha del abono; los abonos posteriores no lo cambian."
              - "El recibo de cualquier abono, también los pagados con café, se abre con el botón «Recibo» en el detalle del préstamo."
        supplies:
          index:
            title: "Insumos"
            summary: "Lo que se presta en especie, como sacos de abono, con su precio predeterminado."
            steps:
              - "Busca por nombre o filtra por activos e inactivos en «Filtros»."
              - "Toca «Nuevo insumo» para agregar uno, o «Editar» para cambiar su nombre, unidad o precio."
            tips:
              - "Cambiar el precio predeterminado no cambia los préstamos que ya se hicieron."
              - "Un insumo que ya no se presta se desactiva; no se borra."
          form:
            title: "Crear o editar un insumo"
            summary: "Nombre, unidad en que se presta y precio predeterminado por unidad."
            steps:
              - "Escribe el nombre, por ejemplo «Abono 18-46-0»."
              - "Escribe la unidad, por ejemplo «saco»; puedes elegir una de las sugeridas."
              - "Escribe el precio por unidad que se pone al prestarlo."
              - "Toca el botón de guardar."
            tips:
              - "Si lo creas desde un préstamo, al guardar queda elegido en ese préstamo."
        credit_accounts:
          index:
            title: "Estados de cuenta"
            summary: "Cada persona a la que se le ha prestado, con lo que debe hoy y su score de pago."
            steps:
              - "Busca por nombre, DNI o RTN, o filtra por quienes tienen saldo o préstamos vencidos."
              - "Toca «Detalle» para ver el estado de cuenta completo de la persona."
          show:
            title: "Estado de cuenta"
            summary: "Todo lo de una persona: totales, score de pago, sus préstamos y su historial crediticio."
            steps:
              - "Revisa el score de pago y cuántos préstamos pagó a tiempo."
              - "Revisa los totales: prestado, pagado y lo que debe hoy."
              - "En «Historial crediticio» está cada préstamo otorgado y cada abono, lo más reciente primero."
              - "Toca «Imprimir» para entregarle una copia, o «Nuevo préstamo» para prestarle otra vez."
              - "En cada préstamo, «Pagaré» y «Contrato» abren el documento lleno con sus datos para revisarlo e imprimirlo; al lado, cuántas veces se ha impreso."
      reports:
        reports:
          show:
            title: "Reportes"
            summary: "Todos los reportes del sistema en una pantalla: eliges el reporte, lo filtras y ves sus cifras, gráficos y registros."
            steps:
              - "Arriba elige el reporte, uno de los «Reportes sugeridos» o uno de «Mis filtros»."
              - "Ajusta los filtros: el período (hoy, este mes, una temporada o fechas a tu gusto) y los propios del reporte. Toca «Aplicar»."
              - "«Agrupar por» suma los registros por día, mes, productor, zona… en vez de verlos uno por uno."
              - "Revisa las cifras de arriba: cada una se compara con el período anterior (▲ subió, ▼ bajó)."
              - "Los gráficos se pueden ocultar tocando «Gráficos». Bajo cada uno, «Ver los datos» muestra sus números."
              - "Los reportes de compras, productores, facturas, préstamos, personas, planillas, latas y gastos traen un mapa: un círculo por persona o finca con ubicación, más grande cuanto más pesa en el reporte. Toca uno para ver su cifra y abrir su página."
              - "La tabla se carga sola a medida que bajas. Toca un encabezado para ordenar por esa columna."
              - "«Guardar filtros» guarda lo que elegiste con un nombre, para abrirlo después desde «Mis filtros»."
            tips:
              - "Un filtro guardado con «Este mes» siempre muestra el mes en curso, no el mes en que lo guardaste."
              - "«Exportar a Excel (CSV)» baja todos los registros del reporte con estos filtros, no solo los que se ven."
              - "Cada reporte necesita el permiso de ver de Reportería y el del módulo de donde salen sus datos."
          charts:
            title: "Gráficos del reporte"
            summary: "Los gráficos de los datos filtrados del reporte."
            steps:
              - "Pasa el dedo o el cursor sobre un gráfico para ver cada valor."
              - "Toca «Ver los datos» bajo un gráfico para ver sus números en una tabla."
              - "En el mapa, acerca o aleja con + y −; toca un círculo para ver su cifra y «Abrir» su página. Debajo dice cuántos no salen por no tener ubicación."
            tips:
              - "La ubicación se agrega en la ficha de la persona o de la finca («Ubicación en el mapa»). En las compras se usa la de la finca de la compra, o la del productor si la finca no tiene."
        saved_reports:
          index:
            title: "Mis filtros"
            summary: "Los filtros de reportes que guardaste. Solo tú los ves."
            steps:
              - "Toca «Abrir» para ver el reporte con esos filtros."
              - "Toca «Borrar» para quitar uno que ya no usas."
          form:
            title: "Guardar filtros"
            summary: "Guarda el reporte con los filtros que elegiste, para abrirlo después desde «Mis filtros»."
            steps:
              - "Escribe un nombre que te diga qué muestra (por ejemplo: «Compras de la zona norte»)."
              - "Toca «Guardar»."
            tips:
              - "Se guarda el período por su nombre: «Este mes» siempre es el mes en curso."

