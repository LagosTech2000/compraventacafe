# Render Blueprint for the service built from `main` (the test server) and its
# database. In Render: New → Blueprint, pick this repository.
#
# RAILS_MASTER_KEY is a secret: Render asks for it when the Blueprint is
# created (the contents of config/master.key). It never goes in this file.
#
# A free database expires 30 days after it is created; change `plan` to a paid
# one (e.g. basic-256mb) to keep it.
#
# The database accepts connections from everywhere so bin/prod-data-tomain can
# reach it from a development machine.
#
# One Puma process (no WEB_CONCURRENCY): Action Cable uses the in-process
# `async` adapter.
version: "1"
projects:
- name: compraventa-cafe
  environments:
  - name: Production
    databases:
    - name: compraventacafe-db
      databaseName: compraventacafe_production
      user: compraventacafe
      plan: free
      region: oregon
      postgresMajorVersion: "18"
      ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
    services:
    - type: web
      name: compraventacafe
      runtime: ruby
      plan: free
      region: oregon
      branch: main
      buildCommand: ./bin/render-build.sh
      startCommand: bundle exec puma -C config/puma.rb
      healthCheckPath: /up
      envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: compraventacafe-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
