<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <title>No se pudo completar la acción</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; }
      body { min-height: 100dvh; display: grid; place-items: center; padding: 1rem; background: #f4efe9; color: #2b2220;
             font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
      main { max-width: 32rem; width: 100%; padding: 2rem; border-radius: 1.5rem; background: #fbf8f4;
             box-shadow: 8px 8px 16px rgb(43 34 32 / 0.12), inset -3px -3px 8px rgb(43 34 32 / 0.06); }
      .code { font-size: 0.875rem; font-weight: 600; color: #6b3f2a; }
      h1 { margin-top: 0.25rem; font-size: 1.5rem; }
      p { margin-top: 0.75rem; color: #6f625c; }
      a { display: inline-block; margin-top: 1.5rem; padding: 0.625rem 1.25rem; border-radius: 1.5rem; background: #6b3f2a;
          color: #fff; font-weight: 600; text-decoration: none; }
      a:hover { background: #56321f; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 422</p>
      <h1>No se pudo completar la acción</h1>
      <p>El formulario expiró o ya no es válido. Vuelve atrás, recarga la página e inténtalo de nuevo.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
